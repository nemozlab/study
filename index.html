<meta name="theme-color" content="#F2F5F9">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9;--card:#FFFFFF;--ink:#14214A;--sub:#656E82;--line:#D3DBE6;
  --accent:#1F3170;--accent-ink:#FFFFFF;--m1:#2F6FAE;--m1bg:#E3F1FB;--m2:#C4562F;--m2bg:#FFE9DF;--ok:#2E7D5B;--okbg:#E4F3E8;--ng:#C4452F;--ngbg:#FDE8E1;
  --hero1:#BFE3F8;--hero2:#EAF1F8;--hero-line:#8EC8EE;--hero-ink:#10194A;--hero-stroke:#FFFFFF;--hero-streak:rgba(255,255,255,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101830;--card:#18224A;--ink:#F3EEE2;--sub:#A9ADC4;--line:#33406E;
    --accent:#8EC8EE;--accent-ink:#101830;--m1:#8EC8EE;--m1bg:#1B3350;--m2:#FFAB8A;--m2bg:#4A2A22;--ok:#6FD3A0;--okbg:#14352A;--ng:#FF8A78;--ngbg:#40201C;
    --hero1:#1F2E5C;--hero2:#2B4478;--hero-line:#3C5A9A;--hero-ink:#FFFFFF;--hero-stroke:#0B1230;--hero-streak:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --bg:#101830;--card:#18224A;--ink:#F3EEE2;--sub:#A9ADC4;--line:#33406E;
    --accent:#8EC8EE;--accent-ink:#101830;--m1:#8EC8EE;--m1bg:#1B3350;--m2:#FFAB8A;--m2bg:#4A2A22;--ok:#6FD3A0;--okbg:#14352A;--ng:#FF8A78;--ngbg:#40201C;
    --hero1:#1F2E5C;--hero2:#2B4478;--hero-line:#3C5A9A;--hero-ink:#FFFFFF;--hero-stroke:#0B1230;--hero-streak:rgba(255,255,255,.07);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.app{max-width:480px;width:100%;margin:0 auto;padding:16px 16px 40px;overflow-x:hidden}
.hero{position:relative;display:flex;align-items:center;height:104px;margin:-16px -16px 12px;overflow:hidden;background:var(--bg);border-bottom:1px solid var(--line)}
.hero-text{position:relative;z-index:2;flex:1;min-width:0;padding:0 12px 0 18px}
.hero h1{margin:0;font:800 clamp(14px,4.7vw,19px)/1.25 "Zen Maru Gothic","Noto Sans KR",sans-serif;color:var(--ink);letter-spacing:0;white-space:nowrap;text-shadow:0 0 4px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}
.hero .en{margin:4px 0 0;font:500 clamp(10.5px,3.1vw,12px)/1.4 "Noto Sans KR",sans-serif;color:var(--ink);white-space:nowrap;text-shadow:0 0 4px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}
.hero .sub{margin:2px 0 0;font:400 10.5px/1.4 "Noto Sans KR","Yu Gothic",sans-serif;color:var(--sub);text-shadow:0 0 4px var(--bg),0 0 8px var(--bg)}
.hero-kaito{position:absolute;right:0;top:-8px;width:340px;height:auto;z-index:1;-webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.015) 5%,rgba(0,0,0,.05) 10%,rgba(0,0,0,.11) 16%,rgba(0,0,0,.2) 22%,rgba(0,0,0,.32) 28%,rgba(0,0,0,.45) 34%,rgba(0,0,0,.58) 40%,rgba(0,0,0,.7) 46%,rgba(0,0,0,.81) 52%,rgba(0,0,0,.9) 58%,rgba(0,0,0,.96) 64%,rgba(0,0,0,.99) 69%,#000 73%);mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.015) 5%,rgba(0,0,0,.05) 10%,rgba(0,0,0,.11) 16%,rgba(0,0,0,.2) 22%,rgba(0,0,0,.32) 28%,rgba(0,0,0,.45) 34%,rgba(0,0,0,.58) 40%,rgba(0,0,0,.7) 46%,rgba(0,0,0,.81) 52%,rgba(0,0,0,.9) 58%,rgba(0,0,0,.96) 64%,rgba(0,0,0,.99) 69%,#000 73%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-kaito{filter:brightness(.8) saturate(.95)}}
:root[data-theme="dark"] .hero-kaito{filter:brightness(.8) saturate(.95)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:2px 0 12px}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.tabs:empty,.chips:empty{display:none}
.tabs.picker{display:block;margin:0 0 12px;padding-top:0;border-top:0}
.opts.ja .btn{font-family:"Klee One","Yu Gothic",serif;font-size:22px;font-weight:600}
.lsn-pick{position:relative;display:block}
.lsn-pick select{display:block;width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:44px;padding:0 42px 0 16px;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer}
.lsn-pick select:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.lsn-pick .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:inline-flex;color:var(--sub);pointer-events:none}
.lsn-pick .chev .ic{width:18px;height:18px}
.lsn-seg{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.lsn-seg .tab{display:flex;align-items:center;justify-content:center;gap:5px;height:41px;padding:0 6px;border:0;border-radius:0;font-size:15px;text-align:center;white-space:nowrap;background:transparent}
.lsn-seg .tab+.tab{border-left:1px solid var(--line)}
.lsn-seg .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-left-color:var(--ink)}
.lsn-seg .tab[aria-pressed="true"]+.tab{border-left-color:var(--ink)}
.lsn-seg .tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tab{flex:none;display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 12px;font:600 13px "Noto Sans KR",sans-serif;cursor:pointer}
.tab small{font-weight:400;font-size:12px;opacity:.7}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta b{color:var(--ink);font-size:15px}
.topbar{margin:0 0 12px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.mode{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;border-radius:0;padding:6px 4px 9px;color:var(--sub);cursor:pointer;font-family:"Noto Sans KR",sans-serif}
.mode b{font-size:15px;font-weight:700;white-space:nowrap}
.mode small{font-size:11.5px;font-weight:400;opacity:.85;white-space:nowrap}
.mode[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mode:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:6px}
.topbar #score{display:block;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.scorerow{display:flex;justify-content:flex-end;margin-top:8px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7;margin-left:3px}
.addrow{margin-bottom:10px}
.modebanner{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-weight:700;font-size:15px;border:1.5px solid}
.modebanner small{font-weight:500;font-size:12px;opacity:.85}
.modebanner.k2j{background:var(--m1bg);color:var(--m1);border-color:var(--m1)}
.modebanner.j2k{background:var(--m2bg);color:var(--m2);border-color:var(--m2)}
.card.k2j{border-color:var(--m1)}
.card.j2k{border-color:var(--m2)}
.opts .btn{margin-top:8px;font-weight:500;font-size:17px}
.qz{text-align:center;margin-bottom:8px}
.qz .mean{font-size:26px;margin:2px 0 12px}
.qrow{display:flex;gap:8px;margin-top:10px}
.qrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:500 18px "Klee One","Noto Sans KR",sans-serif}
.minepanel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.minepanel[hidden]{display:none}
.minepanel textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 15px/1.5 "Noto Sans KR",sans-serif;resize:vertical}
.minemsg{font-size:13px;color:var(--sub);margin:8px 0 0;white-space:pre-line}
.minepanel .list li .k{font-size:18px}
.delbtn{border:0;background:transparent;color:var(--ng);font:700 16px sans-serif;cursor:pointer;padding:4px 8px}
.acct{display:flex;align-items:center;gap:10px;margin:-12px -16px 20px;padding:10px 16px;background:color-mix(in srgb,var(--ink) 5%,var(--bg));border:0;border-radius:0}
.acct:not(.on) .acct-main{background:var(--card);border:0.75px solid var(--line);border-radius:10px;padding:0 10px}
.acct-main{transition:box-shadow .15s}
.acct:not(.on):focus-within .acct-main{box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 14%,transparent)}
.acct.on{background:var(--m1bg)}
.acct-ic{display:inline-flex;width:20px;height:20px;color:var(--sub);flex:none}
.acct-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acct input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 14px "Noto Sans KR",sans-serif;padding:7px 0;outline:none}
.acct input::placeholder{color:var(--sub)}
.acct{--field:var(--card)}
.acct.on{--field:var(--m1bg)}
.acct input:-webkit-autofill,.acct input:-webkit-autofill:hover,.acct input:-webkit-autofill:focus,.acct input:-webkit-autofill:active{-webkit-box-shadow:0 0 0 100px var(--field) inset!important;box-shadow:0 0 0 100px var(--field) inset!important;-webkit-text-fill-color:var(--ink);caret-color:var(--ink);transition:background-color 99999s}
.acct-go{flex:none;border:0;background:color-mix(in srgb,var(--ink) 8%,var(--card));color:var(--ink);font:700 13px "Noto Sans KR",sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.acct-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.acct-score{display:none;flex:none;font-size:12px;color:var(--m1);white-space:nowrap;opacity:.85}
.acct.on .acct-score{display:block}
.acct-lab{display:none;font-size:11px;font-weight:700;line-height:1.2;color:var(--m1);margin-bottom:1px}
.acct.on .acct-lab{display:block}
.acct.on input{padding:8px 0}
.acct.on .acct-ic{color:var(--m1)}
.acct.on input{font-weight:700;cursor:default}
.acct.on .acct-go{background:color-mix(in srgb,var(--m1) 14%,transparent);color:var(--m1);border:0;padding:8px 14px}
.emailrow{display:flex;gap:8px;margin-bottom:10px}
.emailrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:400 14px "Noto Sans KR",sans-serif}
select{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:500 14px "Noto Sans KR",sans-serif}
#main{min-height:100vh;min-height:100svh}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 16px 18px;margin-top:4px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:14px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.grid{container-type:inline-size;display:flex;flex-wrap:nowrap;justify-content:center;gap:5px;margin:6px 0 18px}
.grid.two{flex-wrap:wrap;row-gap:5px}
.grid .brk{flex-basis:100%;height:0}
.box{--w:min(66px,calc((100cqw - (var(--n) - 1) * 5px) / var(--n)));width:var(--w);flex:none;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:calc(var(--w)*.14);font-family:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",serif;font-size:calc(var(--w)*.62);font-weight:600;background:var(--bg)}
.box{white-space:nowrap}
.box.y{font-size:calc(var(--w)*.5);letter-spacing:-.14em;padding-right:.14em}
.grid.ok .box{border-color:var(--ok);background:var(--okbg)}
.grid.ng .box{border-color:var(--ng);background:var(--ngbg)}
.status{min-height:24px;text-align:center;font-size:14px;color:var(--sub);margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:700 16px "Noto Sans KR",sans-serif;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.okb{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok)}
.btn.ngb{background:var(--ngbg);color:var(--ng);border:1.5px solid var(--ng)}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px}
.ic{display:inline-flex;width:26px;height:26px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.iconbtn{display:flex;align-items:center;justify-content:center;padding:13px}
.row .btn{flex:1;width:auto}
.row .btn.wide{flex:2.4;gap:8px;font-size:15px;font-weight:500;white-space:nowrap}
.row .btn.wide .ic{width:20px;height:20px}
.btn:disabled{opacity:.4;cursor:default}
.jbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.jb-menu{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px 8px 12px;font:700 14px "Noto Sans KR",sans-serif;cursor:pointer;white-space:nowrap}
.jb-menu .ic{width:18px;height:18px}
.jb-menu .chev .ic{width:16px;height:16px;transition:transform .15s}
.jb-menu[aria-expanded="true"]{background:var(--m1bg);color:var(--m1);border-color:var(--m1)}
.jb-menu[aria-expanded="true"] .chev .ic{transform:rotate(180deg)}
.jbar .jb-group{display:flex;align-items:center;gap:0;flex:none;margin:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:2px}
.jbar .jb-input{width:96px;padding:6px 8px 6px 6px}
.jbar .jb-go{border-radius:8px;padding:7px 14px}
.jbar .jb-group:focus-within{border-color:var(--accent)}
.jb-menu:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.jumpbar{display:flex;align-items:center;gap:4px;margin:0 0 8px;padding:3px;border:1.5px solid var(--line);border-radius:999px;background:var(--card)}
.jb-toc{flex:none;width:92px;border:0;background:transparent;color:var(--ink);font:700 14px "Noto Sans KR",sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;text-align:center}
.jb-toc[aria-pressed="true"]{background:var(--m1bg);color:var(--m1)}
.jumpbar .jb-toc{display:inline-flex;align-items:center;justify-content:flex-start;gap:8px;width:132px;flex:none;padding:8px 12px 8px 16px}
.jumpbar .jb-toc>span:not(.chev){flex:1;text-align:left}
.jumpbar .jb-toc .ic{width:18px;height:18px}
.jumpbar .jb-toc .chev .ic{width:16px;height:16px;transition:transform .15s}
.jumpbar .jb-toc[aria-expanded="true"] .chev .ic{transform:rotate(180deg)}
.jb-div{width:1px;height:20px;background:var(--line);flex:none}
.jb-group{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}
.jb-input{width:104px;min-width:0;border:0;background:transparent;color:var(--ink);font:500 14px "Noto Sans KR",sans-serif;padding:7px 6px 7px 4px;outline:none;text-align:right}
.jb-input::-webkit-inner-spin-button,.jb-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.jb-input{-moz-appearance:textfield;appearance:textfield}
.jb-input::placeholder{color:var(--sub)}
.jb-go{border:0;background:var(--accent);color:var(--accent-ink);font:700 14px "Noto Sans KR",sans-serif;padding:7px 18px;border-radius:999px;cursor:pointer;white-space:nowrap}
.jb-toc:focus-visible,.jb-go:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.jumpbar:focus-within{border-color:var(--accent)}
.seqbar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.seqjump{margin-left:auto;display:flex;gap:6px;align-items:center}
.seqjump input{width:104px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 8px;font:500 13px "Noto Sans KR",sans-serif}
.toc{list-style:none;margin:0 0 10px;padding:4px 0;max-height:44vh;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.toc li button{display:flex;width:100%;align-items:baseline;gap:10px;padding:9px 14px;border:0;background:transparent;color:var(--ink);text-align:left;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.toc li button.cur{background:var(--m1bg)}
.toc b{width:30px;flex:none;color:var(--sub);font-weight:600}
.toc .k{font-family:"Klee One","Yu Gothic",serif;font-size:17px;font-weight:600}
.toc .m{margin-left:auto;color:var(--sub);font-size:12.5px;text-align:right}
.toc i{font-style:normal;color:var(--ok);width:14px;flex:none;font-weight:700}
.navrow .btn{padding:11px;font-size:15px}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,.speak:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.btn.live{animation:none}.bar i{transition:none}}
.verdict{text-align:center;font-weight:700;font-size:20px;margin:0 0 4px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.heard{text-align:center;font-size:14px;color:var(--sub);margin-bottom:14px;min-height:21px}
.heard b{font-family:"Klee One","Yu Gothic",serif;font-size:18px;color:var(--ink);font-weight:600}
.answer{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px;text-align:center}
.pic{font-size:56px;line-height:1.15}
.mean{font-size:20px;font-weight:700;margin:2px 0 10px}
.forms{display:flex;flex-direction:column;gap:8px;width:fit-content;max-width:100%;margin:0 auto 12px;text-align:left}
.forms div{display:flex;flex-direction:row;align-items:baseline;gap:14px}
.forms dd.ko{font-family:"Noto Sans KR",sans-serif;font-size:clamp(17px,5.2vw,20px);font-weight:400;letter-spacing:0;color:var(--ink)}
.forms dt{flex:none;width:62px;font-size:13px;color:var(--sub)}
.forms dd{letter-spacing:-.06em;margin:0;line-height:1.3;font-family:"Klee One","Yu Gothic",serif;font-size:clamp(20px,6.2vw,24px);font-weight:600;min-width:0}
.speak{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.list{margin:14px 0 0;padding:0;list-style:none;text-align:left}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list .e{font-size:26px;margin-right:8px}
.list .k{font-family:"Klee One",serif;font-size:20px;font-weight:600}
.list .m{font-size:13px;color:var(--sub)}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.copy{margin:32px 0 8px;font-size:11.5px;color:var(--sub);text-align:center;opacity:.85}
.copy .prov{display:inline-block;margin-bottom:4px;font-size:13px;letter-spacing:.2px}
.copy .prov b{color:var(--ink);font-weight:700}
.acct-msg{margin:-10px 0 12px;text-align:center;font-size:12.5px;color:var(--ng)}
.jp-ex{font-family:"Klee One","Yu Gothic",serif;font-size:18px;font-weight:600;color:var(--ink)}
.resume{font-size:12px;color:var(--sub);text-align:center;margin:0 0 8px}

function stopRec(){endListen=null;clearTimeout(timer);if(rec){rec.onend=rec.onerror=rec.onresult=null;try{rec.abort();}catch(e){}rec=null;}}

function speak(t){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}

const speakW=w=>speak(w.kana?`${w.k}。${w.x}`:w.k);
let endListen=null;
let noSound={i:-1,c:0};
const NO_SOUND_MSG=()=>noSound.c>=2?'이 단어는 음성 인식이 잘 안 될 수 있어요. 「정답 보기」로 직접 확인해도 돼요.':'소리가 안 들렸어요. 마이크가 켜진 뒤에 또박또박 읽어보세요.';
const bumpNoSound=()=>{noSound=noSound.i===idx?{i:idx,c:noSound.c+1}:{i:idx,c:1};};
const silenceFor=w=>w.n<=3?2000:w.n===4?2500:3000;
function listen(){
  if(!SR){phase='nomic';msg='이 브라우저는 음성 인식을 지원하지 않아요. 직접 판정으로 진행하세요.';render();return;}
  stopRec();heard='';
  rec=new SR();const KO=isKo();rec.lang=KO?'ko-KR':'ja-JP';rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=true;
  const me=rec;let done=false,segs=[],silence=null;
  const SILENCE_MS=KO?2000:silenceFor(queue[idx]),MAX_MS=25000;
  const end=()=>{
    if(done||rec!==me){clearTimeout(silence);return;}done=true;
    clearTimeout(timer);clearTimeout(silence);endListen=null;
    try{rec&&rec.stop();}catch(e){}
    const text=segs.map(r=>r[0]).join('');
    if(!norm(text)){bumpNoSound();phase='ask';msg=NO_SOUND_MSG();render();return;}
    const prefix=segs.slice(0,-1).map(r=>r[0]).join('');
    const alts=segs[segs.length-1].map(a=>prefix+a);
    if(KO)finishKo(alts);else finish(alts);
  };
  endListen=end;
  rec.onresult=e=>{
    segs=[];
    for(let i=0;i<e.results.length;i++){segs.push([...e.results[i]].map(a=>a.transcript));}
    const sh=segs.map(r=>r[0]).join('');
    const el=document.getElementById('status');if(el){const kt=KO?sh:toKanaText(sh).replace(/[\u4e00-\u9fff々]+/g,'…');el.textContent='듣는 중… '+kt;}
    clearTimeout(silence);silence=setTimeout(end,SILENCE_MS);
  };
  rec.onerror=e=>{
    if(done)return;
    if(e.error==='no-speech'&&segs.length){end();return;}
    done=true;clearTimeout(timer);clearTimeout(silence);endListen=null;
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){phase='nomic';msg='마이크 권한이 없어요. 아래 직접 판정을 사용하세요.';}
    else if(e.error==='no-speech'){bumpNoSound();phase='ask';msg=NO_SOUND_MSG();}
    else if(e.error==='aborted'){return;}
    else{phase='ask';msg='인식 오류('+e.error+'). 다시 시도하세요.';}
    render();
  };
  rec.onaudiostart=()=>{if(done||rec!==me)return;const el=document.getElementById('status');if(el&&!segs.length)el.textContent=KO?'지금 한국어로 뜻을 말해주세요':`지금 말해주세요 · ${SILENCE_MS/1000}초간 조용하면 자동으로 판정해요`;};
  rec.onend=()=>{if(!done)end();};
  try{
    rec.start();phase='listening';msg='';render();
    timer=setTimeout(end,MAX_MS);
  }catch(e){phase='nomic';msg='마이크를 시작할 수 없어요. 직접 판정을 사용하세요.';render();}
}

}
function record(w,ok){
  if(results[idx]===undefined){
    results[idx]=ok;

      P.qstats=P.qstats||{};const key=w.k+'#'+(w.qmode||'k2j');

}
function showHeard(alts){for(const a of alts){const t=toKanaText(a);if(t&&!hasKanji(t))return t;}return '';}
function finish(alts,typed){

  const ok=alts.flatMap(a=>[a,toKanaText(a)]).some(a=>looseHit(a,acc));
  heard=ok?w.k:showHeard(alts);if(typed&&!heard)heard=String(alts[0]||'');heardNoConv=!ok&&!heard;verdict=ok;record(w,ok);phase='result';render();speakW(w);
}

function next(){

}

const HG_BASE={'あ':'아','い':'이','う':'우','え':'에','お':'오','か':['가','카'],'き':['기','키'],'く':['구','쿠'],'け':['게','케'],'こ':['고','코'],'さ':'사','し':'시','す':'스','せ':'세','そ':'소','た':['다','타'],'ち':['지','치'],'つ':'쓰','て':['데','테'],'と':['도','토'],'な':'나','に':'니','ぬ':'누','ね':'네','の':'노','は':'하','ひ':'히','ふ':'후','へ':'헤','ほ':'호','ま':'마','み':'미','む':'무','め':'메','も':'모','や':'야','ゆ':'유','よ':'요','ら':'라','り':'리','る':'루','れ':'레','ろ':'로','わ':'와','を':'오','が':'가','ぎ':'기','ぐ':'구','げ':'게','ご':'고','ざ':'자','じ':'지','ず':'즈','ぜ':'제','ぞ':'조','だ':'다','ぢ':'지','づ':'즈','で':'데','ど':'도','ば':'바','び':'비','ぶ':'부','べ':'베','ぼ':'보','ぱ':'파','ぴ':'피','ぷ':'푸','ぺ':'페','ぽ':'포','ゔ':'부'};
const HG_COMBO={'きゃ':['갸','캬'],'きゅ':['규','큐'],'きょ':['교','쿄'],'ぎゃ':'갸','ぎゅ':'규','ぎょ':'교','しゃ':'샤','しゅ':'슈','しょ':'쇼','じゃ':'자','じゅ':'주','じょ':'조','ちゃ':['자','차'],'ちゅ':['주','추'],'ちょ':['조','초'],'にゃ':'냐','にゅ':'뉴','にょ':'뇨','ひゃ':'햐','ひゅ':'휴','ひょ':'효','びゃ':'뱌','びゅ':'뷰','びょ':'뵤','ぴゃ':'퍄','ぴゅ':'퓨','ぴょ':'표','みゃ':'먀','みゅ':'뮤','みょ':'묘','りゃ':'랴','りゅ':'류','りょ':'료','ふぁ':'파','ふぃ':'피','ふぇ':'페','ふぉ':'포','ふゅ':'퓨','てぃ':'티','でぃ':'디','てゅ':'튜','でゅ':'듀','とぅ':'투','どぅ':'두','うぃ':'위','うぇ':'웨','うぉ':'워','しぇ':'셰','じぇ':'제','ちぇ':['제','체'],'つぁ':'차','つぃ':'치','つぇ':'체','つぉ':'초'};
const HG_ROWS={a:'あかがさざただなはばぱまやらわぁゃ',i:'いきぎしじちぢにひびぴみりぃ',u:'うくぐすずつづぬふぶぷむゆるぅゅゔ',e:'えけげせぜてでねへべぺめれぇ',o:'おこごそぞとどのほぼぽもよろをぉょ'};
const HG_V={};Object.keys(HG_ROWS).forEach(v=>[...HG_ROWS[v]].forEach(c=>HG_V[c]=v));
const HG_SPECIAL={'こんにちは':'곤니치와','こんばんは':'곤반와'};
function hgJong(syl,j){const c=syl.charCodeAt(0)-0xAC00;return(c>=0&&c<11172&&c%28===0)?String.fromCharCode(0xAC00+c+j):syl;}
function toHangul(k){
  if(HG_SPECIAL[k])return HG_SPECIAL[k];
  const ch=[...k],out=[];let lastV='';
  for(let i=0;i<ch.length;i++){
    const c=ch[i],n=ch[i+1]||'';
    if(c==='ー')continue;
    if(c==='っ'){if(out.length)out[out.length-1]=hgJong(out[out.length-1],19);lastV='';continue;}
    if(c==='ん'){if(out.length)out[out.length-1]=hgJong(out[out.length-1],4);lastV='';continue;}
    if(out.length&&((c==='う'&&(lastV==='o'||lastV==='u'))||(c==='お'&&lastV==='o')||(c==='あ'&&lastV==='a')||(c==='い'&&(lastV==='e'||lastV==='i'))||(c==='え'&&lastV==='e')))continue;
    let syl,v;
    if(HG_COMBO[c+n]){syl=HG_COMBO[c+n];v=HG_V[n];i++;}
    else if(HG_BASE[c]){syl=HG_BASE[c];v=HG_V[c];}
    else{out.push(c);lastV='';continue;}
    if(Array.isArray(syl))syl=out.length===0?syl[0]:syl[1];
    out.push(syl);lastV=v;
  }
  return out.join('');
}

      ${phase==='ask'?`<button class="btn primary" data-act="listen">🎤 읽기</button>`:''}
      <button class="btn ${(phase==='nomic'||(noSound.i===idx&&noSound.c>=2))?'primary':'ghost'}" data-act="reveal">정답 보기</button>`;
  }else if(phase==='listening'){
    body=`${Q&&qm==='k2j'?quizPrompt(w):boxes(w)}<div class="status" id="status">마이크를 켜는 중이에요… 켜지면 말해주세요</div>
      <button class="btn primary live" data-act="stop">🎤 다 말했으면 탭하세요</button>`;
  }else if(phase==='reveal'){
    body=`${boxes(w)}${answer(w)}<p class="status" style="margin-top:12px">${Q?'맞게 답했나요?':'맞게 읽었나요?'}</p>
      <div class="row"><button class="btn okb" data-act="mok">맞았어요</button><button class="btn ngb" data-act="mng">틀렸어요</button></div>`;
  }else if(phase==='result'){
    body=`${boxes(w,verdict?'ok':'ng')}
      <p class="verdict ${verdict?'ok':'ng'}">${verdict?'정답 ⭕':'오답 ✖'}</p>
      <div class="heard">${heard?`${Q?'내 답':'내가 읽은 소리'}: <b>${heard}</b>`:(heardNoConv?`${Q?'내 답':'내가 읽은 소리'}: 히라가나로 바꿀 수 없는 결과로 인식됐어요`:'')}</div>
      ${answer(w)}
      <div class="row"><button class="btn ghost iconbtn" data-act="prev"${idx===0?' disabled':''} aria-label="이전" title="이전">${ic('prev')}</button>${SR&&!CH?`<button class="btn ghost iconbtn wide" data-act="listen" aria-label="${Q?'다시 말하기':'다시 읽기'}" title="${Q?'다시 말하기':'다시 읽기'}">${ic('refresh')}<span>${Q?'다시 말하기':'다시 읽기'}</span></button>`:''}<button class="btn primary iconbtn" data-act="next" aria-label="${idx+1>=queue.length?'결과 보기':'다음'}" title="${idx+1>=queue.length?'결과 보기':'다음'}">${ic(idx+1>=queue.length?'check':'next')}</button></div>`;
  }
  const BN={read:['k2j','🗣️ 읽기','히라가나 → 소리'],k2j:['k2j','🎤 말하기','한글 → 일본어'],pron:['j2k','🔤 발음 고르기','히라가나 → 한글 발음'],k2jc:['j2k','👆 일본어 고르기','한글 → 일본어']};
  const banner=Q?(J?`<div class="modebanner j2k">${JS?'🗣️ 뜻 말하기':'👆 뜻 고르기'} <small>일본어 → 한글(${JS?'말하기':'고르기'})</small></div>`:(BN[qm]?`<div class="modebanner ${BN[qm][0]}">${BN[qm][1]} <small>${BN[qm][2]}</small></div>`:'')):'';
  if(phase==='ask'||phase==='nomic'||phase==='reveal'){
    body+=`<div class="row navrow"><button class="btn ghost" data-act="prev"${idx===0?' disabled':''}>◀ 이전</button><button class="btn ghost" data-act="skip">다음 ▶</button></div>`;
  }
  let seqbar='';
  if(w.seqNo&&!isLessonLevel(level)&&!isSpeakLevel(level)){
    const total=w.seqTotal;
    seqbar=`<div class="jumpbar"><button class="jb-toc" data-act="toc" aria-haspopup="true" aria-expanded="${tocOpen}" aria-pressed="${tocOpen}">${ic('list')}<span>목차</span><span class="chev">${ic('down')}</span></button><span class="jb-div" aria-hidden="true"></span><span class="jb-group"><input class="jb-input" id="jn" type="number" inputmode="numeric" min="1" max="${total}" placeholder="번호 (1~${total})" aria-label="이동할 번호"><button class="jb-go" data-act="jump">이동</button></span></div>`;
    if(tocOpen){
      const qs=P.qstats||{};
      seqbar+=`<ul class="toc">${seqItems(level).map(it=>{
        const done=isQuizLevel(level)?(qs[it.key]&&qs[it.key].last===true):(P.stats[it.w.k]&&P.stats[it.w.k].last===true);
        return `<li><button data-jump="${it.no}" class="${it.no===w.seqNo?'cur':''}"><b>${it.no}</b><span class="k">${it.w.k}</span><span class="m">${it.tag?it.tag+' · ':''}${it.w.m||''}</span><i>${done?'✓':''}</i></button></li>`;}).join('')}</ul>`;
    }
  }
  m.innerHTML=`${seqbar}<div class="card${Q?((J||PR||KC)?' j2k':' k2j'):''}">${resumed&&phase==='ask'?'<p class="resume">이전에 하던 라운드를 이어서 진행해요</p>':''}${head}${banner}${body}</div>`;
  fitCard();
}

document.addEventListener('change',e=>{
  if(e.target&&e.target.id==='lsnSel'){const n=+e.target.value;const t=(LV(level)||{t:'L'}).t;start(t+n);}
});
document.addEventListener('click',e=>{
  const jj=e.target.closest('[data-jump]');
  if(jj){jumpTo(+jj.dataset.jump);return;}
  const mm=e.target.closest('[data-mode]');
  if(mm){P.mode=mm.dataset.mode;tocOpen=false;fixLevelForMode();savePrg();start(level);return;}
  const c=e.target.closest('[data-level]');
  if(c){start(c.dataset.level);return;}
  const sp=e.target.closest('[data-speak]');
  if(sp){speak(sp.dataset.speak);return;}
  const a=e.target.closest('[data-act]');
  if(!a)return;
  const act=a.dataset.act,w=queue[idx];
  if(act==='listen')listen();
  else if(act==='stop'){if(endListen)endListen();}
  else if(act==='reveal'){phase='reveal';render();speakW(w);}
  else if(act==='mok')manual(true);
  else if(act==='mng')manual(false);
  else if(act==='next')next();
  else if(act==='speak')speakW(w);
  else if(act==='again')start(level);
  else if(act==='email-edit'){if(Date.now()-lastApplyAt<700)return;acctEditing=true;renderAcct();const inp=document.getElementById('email');if(inp){inp.value='';inp.focus();}setSync('새 이메일을 입력하고 \'입력\'을 눌러주세요');}
  else if(act==='toc'){tocOpen=!tocOpen;render();}
  else if(act==='jump'){const el=document.getElementById('jn');const v=el&&el.value;if(v)jumpTo(+v);}
  else if(act==='prev'){stopRec();if(idx>0){idx--;msg='';heard='';verdict=null;phase='ask';persistSession();render();}}
  else if(act==='skip'){stopRec();next();}
  else if(act==='restartseq'){P.seq=P.seq||{};P.seq[level]=0;savePrg();start(level);}
  else if(act==='email')applyEmail();
  else if(act==='opt')chooseOpt(+a.dataset.i);
  else if(act==='togglemine'){const el=document.getElementById('mine');el.hidden=!el.hidden;a.textContent=el.hidden?'＋ 내 단어 추가':'− 내 단어 닫기';}
  else if(act==='addmine')addCustom();
  else if(act==='delmine')delCustom(a.dataset.k);
});


/* ---- 계정(로그인) 기준 저장: claude.ai 로그인 계정에 비공개로 저장 ---- */
let cloudRef=null,cloudTimer=null,cloudBusy=false,cloudPending=false;
let syncTimer;
function setSync(t){try{const el=document.getElementById('sync');if(!el)return;clearTimeout(syncTimer);if(/형식|못했|없어/.test(t||'')){el.textContent=t;el.hidden=false;syncTimer=setTimeout(()=>{el.hidden=true;},4000);}else{el.textContent='';el.hidden=true;}}catch(e){}}
function scheduleCloud(){if(!cloudRef)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,1500);}
async function pushCloud(){
  if(!cloudRef)return;
  if(cloudBusy){cloudPending=true;return;}
  cloudBusy=true;
  try{
    await cloudRef.set({stats:P.stats,qstats:P.qstats||{},session:P.session||null,level:P.level,ts:P.ts||Date.now(),custom:P.custom||[],mode:P.mode||'random',seq:P.seq||{}});
    syncOn();
  }catch(e){
    cloudRef=null;
    setSync('계정 저장에 실패해서 이 기기·브라우저에만 저장돼요'+(e&&e.code?' ('+e.code+')':''));
  }
  cloudBusy=false;
  if(cloudPending&&cloudRef){cloudPending=false;scheduleCloud();}
}
function mergeCloud(c){
  if(!c)return;
  const cs=c.stats||{};
  for(const k of Object.keys(cs)){const a=P.stats[k],b=cs[k];if(!a||((b&&b.t)||0)>(a.t||0))P.stats[k]=b;}
  mergeQ(c.qstats);
  if((c.ts||0)>(P.ts||0)){if(c.mode)P.mode=c.mode;if(c.seq)P.seq=c.seq;}
  mergeCustom(c.custom);
  const fresh=phase==='ask'&&idx===0&&results.every(r=>r===undefined);
  if(fresh&&c.session&&c.session.q&&c.session.idx<c.session.q.length&&(c.ts||0)>(P.ts||0)){
    P.session=c.session;P.level=c.level||P.level;P.ts=c.ts;
    restore();
  }
  savePrgLocal();
  applyCustom();
  render();
}

/* ---- 내 단어 ---- */
const toHira=t=>(t||'').normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'');
function applyCustom(){
  for(let i=W.length-1;i>=0;i--){if(W[i].custom)W.splice(i,1);}
  const have=new Set(W.map(w=>w.k));
  const ckj=[];
  for(const c of (P.custom||[])){
    if(!c||!c.k||have.has(c.k))continue;
    have.add(c.k);
    const alts=c.kj?[c.kj]:[];
    W.push({k:c.k,alts,m:c.m||'',e:c.e||'📝',c:'내 단어',n:units(c.k).length,custom:true});
    if(c.kj&&hasKanji(c.kj))ckj.push([norm(c.kj),c.k]);
  }
  KJ=[...KJ_BASE,...ckj].sort((a,b)=>b[0].length-a[0].length);
  renderMine();
}
function mergeQ(qs){
  if(!qs)return;P.qstats=P.qstats||{};
  for(const k of Object.keys(qs)){const a=P.qstats[k],b=qs[k];if(!a||((b&&b.t)||0)>(a.t||0))P.qstats[k]=b;}
}
function mergeCustom(list){
  if(!Array.isArray(list))return;
  P.custom=P.custom||[];
  for(const c of list){if(c&&c.k&&!P.custom.some(x=>x.k===c.k))P.custom.push(c);}
}
function setMineMsg(t){const el=document.getElementById('mineMsg');if(el)el.textContent=t;}
function renderMine(){
  const ul=document.getElementById('mineList');if(!ul)return;
  const list=P.custom||[];
  ul.innerHTML=list.map(c=>`<li><span><span class="k">${c.k}</span> <span class="m">${c.kj||''} ${c.m||''}</span></span><button class="delbtn" data-act="delmine" data-k="${c.k}" aria-label="${c.k} 삭제">✕</button></li>`).join('');
}
function addCustom(){
  const ta=document.getElementById('mineText');const text=(ta&&ta.value)||'';
  P.custom=P.custom||[];
  const added=[],dup=[],bad=[];
  text.split('\n').forEach(line=>{
    line=line.trim();if(!line)return;
    let parts;
    if(/[,，\t]|\s-\s/.test(line))parts=line.split(/[,，\t]|\s+-\s+/).map(x=>x.trim());
    else{const m=line.match(/^(\S+)\s+(.+)$/);parts=m?[m[1],m[2]]:[line];}
    const k=toHira(parts[0]);
    if(!/^[ぁ-ゖー]+$/.test(k)||k.length>20){bad.push(parts[0]);return;}
    if(W.some(w=>w.k===k)){dup.push(k);return;}
    const kj=parts.slice(1).find(x=>x&&hasKanji(x)&&!/[가-힣]/.test(x))||'';
    const m=(parts[1]&&parts[1]!==kj)?parts[1]:(parts[2]&&parts[2]!==kj?parts[2]:'');
    const em=parts.slice(1).find(x=>x&&/\p{Extended_Pictographic}/u.test(x))||'';
    const c={k,m:em&&m===em?'':m,kj,e:em||'📝'};
    P.custom.push(c);W.push({k,alts:kj?[kj]:[],m:c.m,e:c.e,c:'내 단어',n:units(k).length,custom:true});
    added.push(k);
  });
  if(P.custom.length>400){P.custom.length=400;}
  applyCustom();
  if(added.length){if(ta)ta.value='';savePrg();}
  const by={};added.forEach(k=>{const n=units(k).length;const key=n>=6?'6음+':n+'음';by[key]=(by[key]||0)+1;});
  let msg=added.length?`${added.length}개 추가했어요 (${Object.entries(by).map(([a,b])=>a+' '+b+'개').join(', ')})`:'추가된 단어가 없어요';
  if(dup.length)msg+=`\n이미 있는 단어라 건너뜀: ${dup.join(', ')}`;
  if(bad.length)msg+=`\n히라가나(카타카나)가 아니라 건너뜀: ${bad.join(', ')}`;
  if(added.length&&!cloudEmail)msg+='\n이메일을 입력해야 새로고침해도 단어가 남아요';
  setMineMsg(msg);
  render();
}
function delCustom(k){
  P.custom=(P.custom||[]).filter(c=>c.k!==k);
  applyCustom();savePrg();
  if(queue.some(w=>w.k===k))start(level);else render();
}
let cloudDb=null,cloudUid=null;
function pickRef(){
  if(!cloudDb)return null;
  return cloudEmail?cloudDb.doc('progress/'+cloudEmail):null;
}
const HINT='이메일을 입력하면 그 이메일 기준으로 기록이 저장돼요';
function syncOn(){setSync(cloudEmail?`☁️ ${cloudEmail} 기준으로 자동 저장 중`:HINT);}
let acctEditing=false;
const ACCT_ICON={mail:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg>',ok:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>'};
function renderAcct(){
  const box=document.getElementById('acct'),inp=document.getElementById('email'),btn=document.getElementById('acctBtn'),ic=document.getElementById('acctIc');
  if(!box||!inp||!btn||!ic)return;
  const locked=!!cloudEmail&&!acctEditing;
  box.classList.toggle('on',locked);
  inp.readOnly=locked;
  if(locked)inp.value=cloudEmail;
  btn.textContent=locked?'재입력':'입력';
  btn.dataset.act=locked?'email-edit':'email';
  ic.innerHTML=locked?ACCT_ICON.ok:ACCT_ICON.mail;
}
let lastApplyAt=0;
async function applyEmail(){
  lastApplyAt=Date.now();
  const inp0=document.getElementById('email');
  // 재입력 중에 빈 칸으로 '입력' → 취소 (현재 이메일 유지)
  if(inp0&&!inp0.value.trim()&&cloudEmail&&acctEditing){acctEditing=false;renderAcct();syncOn();return;}
  await applyEmailCore();
  const inp=document.getElementById('email');
  if(cloudEmail&&inp&&emailKey(inp.value)===cloudEmail)acctEditing=false;
  renderAcct();
}
async function applyEmailCore(){
  const inp=document.getElementById('email');const raw=((inp&&inp.value)||'').trim();
  let em='';
  if(raw){em=emailKey(raw);if(!em){setSync('이메일 형식을 확인해주세요');return;}}
  if(em===cloudEmail){if(inp)inp.value=em;return;}
  stopRec();
  savePrgLocal();
  if(cloudRef){clearTimeout(cloudTimer);try{await pushCloud();}catch(e){}}
  cloudEmail=em;
  if(inp)inp.value=em;
  P=loadLocal();
  cloudRef=pickRef();
  let existed=false;
  if(cloudRef){
    try{
      const snap=await cloudRef.get();
      if(snap.exists){
        existed=true;const c=snap.data()||{},cs=c.stats||{};
        for(const k of Object.keys(cs)){const x=P.stats[k],y=cs[k];if(!x||((y&&y.t)||0)>(x.t||0))P.stats[k]=y;}
        mergeQ(c.qstats);
        if((c.ts||0)>(P.ts||0)){if(c.mode)P.mode=c.mode;if(c.seq)P.seq=c.seq;}
        mergeCustom(c.custom);
        if(c.session&&c.session.q&&c.session.idx<c.session.q.length&&(c.ts||0)>(P.ts||0)){P.session=c.session;P.level=c.level||P.level;P.ts=c.ts;}
      }
    }catch(e){cloudRef=null;setSync('이메일 기록을 불러오지 못했어요'+(e&&e.code?' ('+e.code+')':''));}
  }
  savePrgLocal();
  applyCustom();
  level=P.level||'2';fixLevelForMode();
  if(!restore())start(level);else render();
  if(cloudRef){setSync(existed?`☁️ ${em} 기록을 불러왔어요`:`☁️ ${em} 새 기록으로 시작해요`);scheduleCloud();}
  else if(!cloudDb)setSync(em?`${em} 기준으로 이 기기·브라우저에 저장돼요`:HINT);
  else if(!em)setSync(HINT);
}
async function initCloud(){
  try{
    const inp=document.getElementById('email');
    if(inp)inp.value='';
    if(!window.claude||!window.claude.use){setSync(cloudEmail?'이 기기·브라우저에만 저장돼요 (claude.ai 링크로 열면 이메일 기준으로 어디서든 이어져요)':HINT);return;}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    cloudDb=db;cloudUid=(db&&user)?await user.id():null;
    cloudRef=pickRef();
    if(!cloudRef){setSync(cloudEmail?'로그인 정보를 확인할 수 없어 이 기기·브라우저에만 저장돼요':HINT);return;}
    const snap=await cloudRef.get();
    if(snap.exists)mergeCloud(snap.data());
    syncOn();scheduleCloud();
  }catch(e){setSync('진행 기록은 이 기기·브라우저에만 저장돼요');}
}
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='jn'&&e.key==='Enter'&&e.target.value)jumpTo(+e.target.value);
  if(e.target&&e.target.id==='email'&&e.key==='Enter')applyEmail();});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='email'&&e.target.value.trim())applyEmail();});
document.addEventListener('input',e=>{

  }
});
if('speechSynthesis' in window){speechSynthesis.getVoices();}
applyCustom();
fixLevelForMode();
if(!restore())start(level);else render();
renderAcct();
initCloud();
