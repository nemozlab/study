<meta name="theme-color" content="#F2F5F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Noto+Sans+KR:wght@400;500;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9;--card:#FFFFFF;--ink:#14214A;--sub:#656E82;--line:#D3DBE6;
  --accent:#1F3170;--accent-ink:#FFFFFF;--m1:#2F6FAE;--m1bg:#E3F1FB;--m2:#C4562F;--m2bg:#FFE9DF;--ok:#2E7D5B;--okbg:#E4F3E8;--ng:#C4452F;--ngbg:#FDE8E1;
  --hero1:#BFE3F8;--hero2:#EAF1F8;--hero-line:#8EC8EE;--hero-ink:#10194A;--hero-stroke:#FFFFFF;--hero-streak:rgba(255,255,255,.5);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101830;--card:#18224A;--ink:#F3EEE2;--sub:#A9ADC4;--line:#33406E;
    --accent:#8EC8EE;--accent-ink:#101830;--m1:#8EC8EE;--m1bg:#1B3350;--m2:#FFAB8A;--m2bg:#4A2A22;--ok:#6FD3A0;--okbg:#14352A;--ng:#FF8A78;--ngbg:#40201C;
    --hero1:#1F2E5C;--hero2:#2B4478;--hero-line:#3C5A9A;--hero-ink:#FFFFFF;--hero-stroke:#0B1230;--hero-streak:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --bg:#101830;--card:#18224A;--ink:#F3EEE2;--sub:#A9ADC4;--line:#33406E;
    --accent:#8EC8EE;--accent-ink:#101830;--m1:#8EC8EE;--m1bg:#1B3350;--m2:#FFAB8A;--m2bg:#4A2A22;--ok:#6FD3A0;--okbg:#14352A;--ng:#FF8A78;--ngbg:#40201C;
    --hero1:#1F2E5C;--hero2:#2B4478;--hero-line:#3C5A9A;--hero-ink:#FFFFFF;--hero-stroke:#0B1230;--hero-streak:rgba(255,255,255,.07);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.app{max-width:480px;width:100%;margin:0 auto;padding:16px 16px 40px;overflow-x:hidden}
.hero{position:relative;display:flex;align-items:center;height:104px;margin:-16px -16px 12px;overflow:hidden;background:var(--bg);border-bottom:1px solid var(--line)}
.hero-text{position:relative;z-index:2;flex:1;min-width:0;padding:0 12px 0 18px}
.hero h1{margin:0;font:800 clamp(14px,4.7vw,19px)/1.25 "Zen Maru Gothic","Noto Sans KR",sans-serif;color:var(--ink);letter-spacing:0;white-space:nowrap;text-shadow:0 0 4px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}
.hero .en{margin:4px 0 0;font:500 clamp(10.5px,3.1vw,12px)/1.4 "Noto Sans KR",sans-serif;color:var(--ink);white-space:nowrap;text-shadow:0 0 4px var(--bg),0 0 8px var(--bg),0 0 12px var(--bg)}
.hero .sub{margin:2px 0 0;font:400 10.5px/1.4 "Noto Sans KR","Yu Gothic",sans-serif;color:var(--sub);text-shadow:0 0 4px var(--bg),0 0 8px var(--bg)}
.hero-kaito{position:absolute;right:0;top:-8px;width:340px;height:auto;z-index:1;-webkit-mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.015) 5%,rgba(0,0,0,.05) 10%,rgba(0,0,0,.11) 16%,rgba(0,0,0,.2) 22%,rgba(0,0,0,.32) 28%,rgba(0,0,0,.45) 34%,rgba(0,0,0,.58) 40%,rgba(0,0,0,.7) 46%,rgba(0,0,0,.81) 52%,rgba(0,0,0,.9) 58%,rgba(0,0,0,.96) 64%,rgba(0,0,0,.99) 69%,#000 73%);mask-image:linear-gradient(to right,transparent 0,rgba(0,0,0,.015) 5%,rgba(0,0,0,.05) 10%,rgba(0,0,0,.11) 16%,rgba(0,0,0,.2) 22%,rgba(0,0,0,.32) 28%,rgba(0,0,0,.45) 34%,rgba(0,0,0,.58) 40%,rgba(0,0,0,.7) 46%,rgba(0,0,0,.81) 52%,rgba(0,0,0,.9) 58%,rgba(0,0,0,.96) 64%,rgba(0,0,0,.99) 69%,#000 73%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero-kaito{filter:brightness(.8) saturate(.95)}}
:root[data-theme="dark"] .hero-kaito{filter:brightness(.8) saturate(.95)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:2px 0 12px}
.chip{flex:none;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 12px;padding-top:14px;border-top:1px solid var(--line)}
.tabs:empty,.chips:empty{display:none}
.tabs.picker{display:block;margin:0 0 12px;padding-top:0;border-top:0}
.opts.ja .btn{font-family:"Klee One","Yu Gothic",serif;font-size:22px;font-weight:600}
.lsn-pick{position:relative;display:block}
.lsn-pick select{display:block;width:100%;appearance:none;-webkit-appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;height:44px;padding:0 42px 0 16px;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer}
.lsn-pick select:focus-visible{outline:none}
.lsn-pick .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:inline-flex;color:var(--sub);pointer-events:none}
.lsn-pick .chev .ic{width:18px;height:18px}
.lsn-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.lsn-seg .tab{display:flex;align-items:center;justify-content:center;gap:4px;height:41px;padding:0 3px;border:0;border-radius:0;font-size:14.5px;text-align:center;white-space:nowrap;background:transparent}
.lsn-seg .tab+.tab{border-left:1px solid var(--line)}
.lsn-seg .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-left-color:var(--ink)}
.lsn-seg .tab[aria-pressed="true"]+.tab{border-left-color:var(--ink)}
.lsn-seg .tab:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.tab{flex:none;display:inline-flex;align-items:baseline;gap:6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:6px;padding:5px 12px;font:600 13px "Noto Sans KR",sans-serif;cursor:pointer}
.tab small{font-weight:400;font-size:12px;opacity:.7}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.meta b{color:var(--ink);font-size:15px}
.topbar{margin:0 0 12px}
.modes{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-bottom:1px solid var(--line)}
.mode{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;border-radius:0;padding:6px 4px 9px;color:var(--sub);cursor:pointer;font-family:"Noto Sans KR",sans-serif}
.mode b{font-size:15px;font-weight:700;white-space:nowrap}
.mode small{font-size:11.5px;font-weight:400;opacity:.85;white-space:nowrap}
.mode[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.mode:focus-visible{outline:3px solid var(--accent);outline-offset:-3px;border-radius:6px}
.topbar #score{display:block;font-size:12px;color:var(--sub);text-align:right;white-space:nowrap}
.scorerow{display:flex;justify-content:flex-end;margin-top:8px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{opacity:.7;margin-left:3px}
.addrow{margin-bottom:10px}
.modebanner{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:10px 12px;margin:-4px 0 14px;font-weight:700;font-size:15px;border:1.5px solid}
.modebanner small{font-weight:500;font-size:12px;opacity:.85}
.modebanner.k2j{background:var(--m1bg);color:var(--m1);border-color:var(--m1)}
.modebanner.j2k{background:var(--m2bg);color:var(--m2);border-color:var(--m2)}
.card.k2j{border-color:var(--m1)}
.card.j2k{border-color:var(--m2)}
.opts .btn{margin-top:8px;font-weight:500;font-size:17px}
.qz{text-align:center;margin-bottom:8px}
.qz .mean{font-size:26px;margin:2px 0 12px}
.qrow{display:flex;gap:8px;margin-top:10px}
.qrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:500 18px "Klee One","Noto Sans KR",sans-serif}
.minepanel{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.minepanel[hidden]{display:none}
.minepanel textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 15px/1.5 "Noto Sans KR",sans-serif;resize:vertical}
.minemsg{font-size:13px;color:var(--sub);margin:8px 0 0;white-space:pre-line}
.minepanel .list li .k{font-size:18px}
.delbtn{border:0;background:transparent;color:var(--ng);font:700 16px sans-serif;cursor:pointer;padding:4px 8px}
.acct{display:flex;align-items:center;gap:10px;margin:-12px -16px 20px;padding:10px 16px;background:color-mix(in srgb,var(--ink) 5%,var(--bg));border:0;border-radius:0}
.acct:not(.on) .acct-main{background:var(--card);border:0.75px solid var(--line);border-radius:10px;padding:0 10px}
.acct-main{transition:box-shadow .15s}
.acct:not(.on):focus-within .acct-main{box-shadow:0 2px 10px color-mix(in srgb,var(--ink) 14%,transparent)}
.acct.on{background:var(--m1bg)}
.acct-ic{display:inline-flex;width:20px;height:20px;color:var(--sub);flex:none}
.acct-ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.acct input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:400 14px "Noto Sans KR",sans-serif;padding:7px 0;outline:none}
.acct input::placeholder{color:var(--sub)}
.acct{--field:var(--card)}
.acct.on{--field:var(--m1bg)}
.acct input:-webkit-autofill,.acct input:-webkit-autofill:hover,.acct input:-webkit-autofill:focus,.acct input:-webkit-autofill:active{-webkit-box-shadow:0 0 0 100px var(--field) inset!important;box-shadow:0 0 0 100px var(--field) inset!important;-webkit-text-fill-color:var(--ink);caret-color:var(--ink);transition:background-color 99999s}
.acct-go{flex:none;border:0;background:color-mix(in srgb,var(--ink) 8%,var(--card));color:var(--ink);font:700 13px "Noto Sans KR",sans-serif;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
.acct-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.acct-score{display:none;flex:none;font-size:12px;color:var(--m1);white-space:nowrap;opacity:.85}
.acct.on .acct-score{display:block}
.acct-lab{display:none;font-size:11px;font-weight:700;line-height:1.2;color:var(--m1);margin-bottom:1px}
.acct.on .acct-lab{display:block}
.acct.on input{padding:8px 0}
.acct.on .acct-ic{color:var(--m1)}
.acct.on input{font-weight:700;cursor:default}
.acct.on .acct-go{background:color-mix(in srgb,var(--m1) 14%,transparent);color:var(--m1);border:0;padding:8px 14px}
.emailrow{display:flex;gap:8px;margin-bottom:10px}
.emailrow input{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 12px;font:400 14px "Noto Sans KR",sans-serif}
select{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font:500 14px "Noto Sans KR",sans-serif}
#main{min-height:100vh;min-height:100svh}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px 16px 18px;margin-top:4px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin-bottom:14px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.grid{container-type:inline-size;display:flex;flex-wrap:nowrap;justify-content:center;gap:5px;margin:6px 0 18px}
.grid.two{flex-wrap:wrap;row-gap:5px}
.grid .brk{flex-basis:100%;height:0}
.box{--w:min(66px,calc((100cqw - (var(--n) - 1) * 5px) / var(--n)));width:var(--w);flex:none;aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line);border-radius:calc(var(--w)*.14);font-family:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",serif;font-size:calc(var(--w)*.62);font-weight:600;background:var(--bg)}
.box{white-space:nowrap}
.box.y{font-size:calc(var(--w)*.5);letter-spacing:-.14em;padding-right:.14em}
.grid.ok .box{border-color:var(--ok);background:var(--okbg)}
.grid.ng .box{border-color:var(--ng);background:var(--ngbg)}
.status{min-height:24px;text-align:center;font-size:14px;color:var(--sub);margin-bottom:12px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font:700 16px "Noto Sans KR",sans-serif;cursor:pointer;margin-top:10px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.okb{background:var(--okbg);color:var(--ok);border:1.5px solid var(--ok)}
.btn.ngb{background:var(--ngbg);color:var(--ng);border:1.5px solid var(--ng)}
.row{display:flex;gap:10px}
.row .btn{margin-top:10px}
.ic{display:inline-flex;width:26px;height:26px;flex:none}
.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.iconbtn{display:flex;align-items:center;justify-content:center;padding:13px}
.row .btn{flex:1;width:auto}
.row .btn.wide{flex:2.4;gap:8px;font-size:15px;font-weight:500;white-space:nowrap}
.row .btn.wide .ic{width:20px;height:20px}
.btn:disabled{opacity:.4;cursor:default}
.jbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.jb-menu{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 10px 8px 12px;font:700 14px "Noto Sans KR",sans-serif;cursor:pointer;white-space:nowrap}
.jb-menu .ic{width:18px;height:18px}
.jb-menu .chev .ic{width:16px;height:16px;transition:transform .15s}
.jb-menu[aria-expanded="true"]{background:var(--m1bg);color:var(--m1);border-color:var(--m1)}
.jb-menu[aria-expanded="true"] .chev .ic{transform:rotate(180deg)}
.jbar .jb-group{display:flex;align-items:center;gap:0;flex:none;margin:0;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:2px}
.jbar .jb-input{width:96px;padding:6px 8px 6px 6px}
.jbar .jb-go{border-radius:8px;padding:7px 14px}
.jbar .jb-group:focus-within{border-color:var(--accent)}
.jb-menu:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.jumpbar{display:flex;align-items:center;gap:4px;margin:0 0 8px;padding:3px;border:1.5px solid var(--line);border-radius:999px;background:var(--card)}
.jb-toc{flex:none;width:92px;border:0;background:transparent;color:var(--ink);font:700 14px "Noto Sans KR",sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;text-align:center}
.jb-toc[aria-pressed="true"]{background:var(--m1bg);color:var(--m1)}
.jumpbar .jb-toc{display:inline-flex;align-items:center;justify-content:flex-start;gap:8px;width:132px;flex:none;padding:8px 12px 8px 16px}
.jumpbar .jb-toc>span:not(.chev){flex:1;text-align:left}
.jumpbar .jb-toc .ic{width:18px;height:18px}
.jumpbar .jb-toc .chev .ic{width:16px;height:16px;transition:transform .15s}
.jumpbar .jb-toc[aria-expanded="true"] .chev .ic{transform:rotate(180deg)}
.jb-div{width:1px;height:20px;background:var(--line);flex:none}
.jb-group{display:flex;align-items:center;gap:2px;flex:none;margin-left:auto}
.jb-input{width:104px;min-width:0;border:0;background:transparent;color:var(--ink);font:500 14px "Noto Sans KR",sans-serif;padding:7px 6px 7px 4px;outline:none;text-align:right}
.jb-input::-webkit-inner-spin-button,.jb-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.jb-input{-moz-appearance:textfield;appearance:textfield}
.jb-input::placeholder{color:var(--sub)}
.jb-go{border:0;background:var(--accent);color:var(--accent-ink);font:700 14px "Noto Sans KR",sans-serif;padding:7px 18px;border-radius:999px;cursor:pointer;white-space:nowrap}
.jb-toc:focus-visible,.jb-go:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.jumpbar:focus-within{border-color:var(--accent)}
.seqbar{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.seqjump{margin-left:auto;display:flex;gap:6px;align-items:center}
.seqjump input{width:104px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 8px;font:500 13px "Noto Sans KR",sans-serif}
.toc{list-style:none;margin:0 0 10px;padding:4px 0;max-height:44vh;overflow:auto;background:var(--card);border:1.5px solid var(--line);border-radius:12px}
.toc li button{display:flex;width:100%;align-items:baseline;gap:10px;padding:9px 14px;border:0;background:transparent;color:var(--ink);text-align:left;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.toc li button.cur{background:var(--m1bg)}
.toc b{width:30px;flex:none;color:var(--sub);font-weight:600}
.toc .k{font-family:"Klee One","Yu Gothic",serif;font-size:17px;font-weight:600}
.toc .m{margin-left:auto;color:var(--sub);font-size:12.5px;text-align:right}
.toc i{font-style:normal;color:var(--ok);width:14px;flex:none;font-weight:700}
.navrow .btn{padding:11px;font-size:15px}
.btn:focus-visible,.chip:focus-visible,select:focus-visible,.speak:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.live{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@media (prefers-reduced-motion:reduce){.btn.live{animation:none}.bar i{transition:none}}
.verdict{text-align:center;font-weight:700;font-size:20px;margin:0 0 4px}
.verdict.ok{color:var(--ok)}.verdict.ng{color:var(--ng)}
.heard{text-align:center;font-size:14px;color:var(--sub);margin-bottom:14px;min-height:21px}
.heard b{font-family:"Klee One","Yu Gothic",serif;font-size:18px;color:var(--ink);font-weight:600}
.answer{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px;text-align:center}
.pic{font-size:56px;line-height:1.15}
.mean{font-size:20px;font-weight:700;margin:2px 0 10px}
.forms{display:flex;flex-direction:column;gap:8px;width:fit-content;max-width:100%;margin:0 auto 12px;text-align:left}
.forms div{display:flex;flex-direction:row;align-items:baseline;gap:14px}
.forms dd.ko{font-family:"Noto Sans KR",sans-serif;font-size:clamp(17px,5.2vw,20px);font-weight:400;letter-spacing:0;color:var(--ink)}
.forms dt{flex:none;width:62px;font-size:13px;color:var(--sub)}
.forms dd{letter-spacing:-.06em;margin:0;line-height:1.3;font-family:"Klee One","Yu Gothic",serif;font-size:clamp(20px,6.2vw,24px);font-weight:600;min-width:0}
.speak{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.list{margin:14px 0 0;padding:0;list-style:none;text-align:left}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.list .e{font-size:26px;margin-right:8px}
.list .k{font-family:"Klee One",serif;font-size:20px;font-weight:600}
.list .m{font-size:13px;color:var(--sub)}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.copy{margin:32px 0 8px;font-size:11.5px;color:var(--sub);text-align:center;opacity:.85}
.copy .prov{display:inline-block;margin-bottom:4px;font-size:13px;letter-spacing:.2px}
.copy .prov b{color:var(--ink);font-weight:700}
.acct-msg{margin:-10px 0 12px;text-align:center;font-size:12.5px;color:var(--ng)}
.jp-ex{font-family:"Klee One","Yu Gothic",serif;font-size:18px;font-weight:600;color:var(--ink)}
.resume{font-size:12px;color:var(--sub);text-align:center;margin:0 0 8px}

html.splash-on #splash.out{opacity:0;pointer-events:none}

.meta{align-items:baseline}
.meta>span:last-child{display:inline-flex;align-items:center;gap:2px}
.star{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;margin:-6px -7px -6px 0;border:0;background:transparent;color:var(--sub);padding:0;cursor:pointer}
.star svg{width:16px;height:16px;transform:translateY(-.4px)}
.star path{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round}
.star.on{color:#E0A100}
.star.on path{fill:currentColor}
.star:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.chip-star{border-color:#E0A100}
.chip-star[aria-pressed="true"]{background:#E0A100;border-color:#E0A100;color:#fff}
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);width:max-content;max-width:88vw;background:var(--ink);color:var(--bg);font:500 14px/1.5 "Noto Sans KR",sans-serif;padding:11px 18px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:10000;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes nudgeRing{0%,100%{box-shadow:0 0 0 0 rgba(47,111,174,0)}50%{box-shadow:0 0 0 5px rgba(47,111,174,.38)}}
.acct.nudge:not(.on) .acct-main{animation:nudgeRing .7s ease 3}

/* ===== 오디오 레슨 ===== */
.lsn-row{display:flex;gap:10px;align-items:stretch}
.lsn-row .lsn-pick{flex:1;min-width:0}
.aud-btn{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 15px;border:1.5px solid rgba(255,255,255,.12);border-radius:12px;background:#20306F;color:#fff;font:700 15px "Noto Sans KR",sans-serif;cursor:pointer;white-space:nowrap}
.aud-btn svg{width:20px;height:20px}
.aud-btn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#aud [hidden]{display:none!important}
.aud-player{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;box-sizing:border-box;max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top,0px)) 20px calc(22px + env(safe-area-inset-bottom,0px));background:#101B40;color:#fff;font-family:"Noto Sans KR","Noto Sans JP",sans-serif;overflow:hidden}
.ap-top{display:flex;align-items:center;justify-content:space-between;height:52px;flex:none}
.ap-icon{flex:none;width:44px;height:44px;padding:0;border:0;border-radius:22px;background:rgba(255,255,255,.10);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ap-icon svg{width:24px;height:24px}
.ap-title{text-align:center}.ap-title b{display:block;font-size:17px;font-weight:700}.ap-title small{display:block;margin-top:2px;font-size:13.5px;color:#B4BFDD}
.ap-main{position:relative;flex:1;min-height:0;padding-bottom:6px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.ap-star{position:absolute;top:4px;right:0;z-index:2;width:44px;height:44px;margin:0;padding:0;border:0;border-radius:22px;background:rgba(255,255,255,.10);color:#B4BFDD;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ap-star svg{width:22px;height:22px}
.ap-star[aria-pressed="true"]{background:rgba(240,180,41,.18);color:#F0B429}
.ap-a,.ap-b{display:flex;flex-direction:column;align-items:center;max-width:100%}
.ap-hira{font-weight:700;font-family:"Noto Sans JP",sans-serif;line-height:1.1;letter-spacing:2px;overflow-wrap:anywhere;text-wrap:balance}
.ap-kanji{margin-top:4px;font-size:24px;color:#9AA6CB;font-family:"Noto Sans JP",sans-serif;min-height:1px}
.ap-mean{margin-top:clamp(6px,1.4vh,10px);font-size:24px;line-height:1.2;font-weight:700;color:#F0B429;transition:opacity .25s}
.ap-mean.dim{opacity:.30}
.ap-ex{margin-top:clamp(18px,5vh,36px);transition:opacity .25s}.ap-ex.dim{opacity:.38}
.ap-ex .ja{font-size:27px;line-height:1.9;font-family:"Noto Sans JP",sans-serif;text-wrap:balance}
.ap-ex rt{font-size:13.5px}
.ap-ex .ko{margin-top:4px;font-size:15px;color:#B4BFDD;transition:opacity .25s}.ap-ex .ko.dim{opacity:.45}
.ap-ctx{display:flex;align-items:baseline;gap:10px;font-family:"Noto Sans JP",sans-serif}.ap-ctxm{margin-top:6px;font-size:22px;line-height:1.2;font-weight:700;color:#F0B429}
.ap-ctx b{font-size:26px;font-weight:500;color:#F0B429}.ap-ctx span{font-size:18px;color:#9AA6CB}
.ap-sent{margin-top:20px;padding:0 4px;line-height:1.9;font-weight:700;font-family:"Noto Sans JP",sans-serif;text-wrap:balance;line-break:strict;overflow-wrap:anywhere}
.ap-sent rt{font-size:.4em;font-weight:500}
.hl{color:#F0B429;border-bottom:3px solid #F0B429}
.nw{white-space:nowrap}
.ap-sko{margin-top:18px;font-size:17px;line-height:1.4;color:#B4BFDD}
.aud-player rt{color:#B4BFDD}
.ap-prog{position:relative;display:flex;justify-content:space-between;font-size:13px;color:#8D9AC0;flex:none}
.ap-toast{position:absolute;left:50%;bottom:5px;transform:translate(-50%,4px);height:28px;max-width:92%;box-sizing:border-box;padding:0 16px;display:flex;align-items:center;border-radius:14px;background:#1D2C62;border:0;color:#fff;font:500 13.5px "Noto Sans KR",sans-serif;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.30);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:3}
.ap-toast.show{opacity:1;transform:translate(-50%,0)}
.ap-bar{height:5px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px;flex:none}.ap-bar i{display:block;height:5px;border-radius:3px;background:#F0B429;width:0;transition:width .3s}
.ap-ctls{flex:none;width:344px;margin:0 auto;zoom:var(--k,1)}
.ap-ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px}
.ap-c{padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;cursor:pointer}
.ap-c.sm{width:56px;height:56px;border:2px solid rgba(255,255,255,.28);background:transparent;color:#fff}.ap-c.sm svg{width:24px;height:24px}
.ap-c.big{width:88px;height:88px;border:0;background:#fff;color:#101B40}.ap-c.big svg{width:38px;height:38px}
.ap-opts{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px}
.ap-o{flex:none;width:48px;height:48px;margin:0;padding:0;border:0;border-radius:24px;background:rgba(255,255,255,.10);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font:700 13.5px "Noto Sans KR",sans-serif;letter-spacing:-.2px;cursor:pointer}
.ap-o svg{width:22px;height:22px}
.ap-o[aria-pressed="true"]{background:rgba(240,180,41,.18);color:#F0B429}
.ap-sw{display:flex;width:284px;height:48px;overflow:hidden;border-radius:24px;background:rgba(255,255,255,.10)}
.ap-sw button{flex:1;height:100%;margin:0;padding:0;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;background:transparent;color:#B4BFDD;cursor:pointer}
.ap-sw button+button{border-left:1px solid rgba(255,255,255,.12)}
.ap-sw button[aria-pressed="true"]{background:rgba(240,180,41,.18);color:#F0B429;border-left-color:transparent}
.ap-sw svg{width:26px;height:26px}
.ap-sw .kana{display:block;font:400 26px/26px "Noto Sans JP",sans-serif}
.ap-icon:focus-visible,.ap-c:focus-visible,.ap-o:focus-visible,.ap-star:focus-visible,.ap-sw button:focus-visible,.ap-li:focus-visible{outline:3px solid #8EC8EE;outline-offset:2px}
.ap-list{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));background:#101B40}
.ap-list-head{display:flex;align-items:center;justify-content:space-between;height:52px}.ap-list-head b{font-size:18px}
.ap-list-sub{margin-top:4px;font-size:13.5px;color:#B4BFDD}
.ap-list-body{flex:1;overflow:auto;margin-top:10px;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 14px);mask-image:linear-gradient(to bottom,transparent 0,#000 14px)}
.ap-li{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 10px;border:0;border-bottom:1px solid rgba(255,255,255,.10);background:transparent;color:#fff;text-align:left;font:500 16px "Noto Sans KR","Noto Sans JP",sans-serif;cursor:pointer}
.ap-li .n{flex:none;width:24px;color:#8D9AC0;font-size:13px}.ap-li .w{flex:1;min-width:0;font-family:"Noto Sans JP",sans-serif;font-size:24px;font-weight:500}.ap-li .w small{color:#8D9AC0;font-size:14px}.ap-li .m{flex:none;color:#F0B429;font-weight:700;max-width:42%;text-align:right}
.ap-li.on{background:rgba(240,180,41,.14)}
@media (max-height:700px){.ap-ctl{margin-top:12px}.ap-opts{margin-top:12px}}

/* ===== 학습 화면 새 디자인 ===== */
:root{--tile:#F5F7FB;--soft:#F0F3F8;--soft2:#E9EDF4;--ctl:#5C6A8E;--rail:#E8ECF3;--navy:#20306F;--gold-bg:rgba(90,79,207,.14);--gold-ink:#4A3FB8;--retry:#2A2175;--sep:rgba(20,33,74,.09);--shadow:0 1px 2px rgba(20,33,74,.05),0 14px 36px rgba(20,33,74,.07);--cap:rgba(32,48,111,.06)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--tile:#212C5A;--soft:#222E5E;--soft2:#1D2754;--ctl:#B4BFDD;--rail:#2A3668;--navy:#3B4DA3;--gold-bg:rgba(150,140,255,.22);--gold-ink:#C3BDFF;--retry:#5B4EC2;--sep:rgba(255,255,255,.09);--shadow:0 1px 0 rgba(255,255,255,.04),0 14px 36px rgba(0,0,0,.35);--cap:rgba(255,255,255,.06)}}
:root[data-theme="dark"]{--tile:#212C5A;--soft:#222E5E;--soft2:#1D2754;--ctl:#B4BFDD;--rail:#2A3668;--navy:#3B4DA3;--gold-bg:rgba(150,140,255,.22);--gold-ink:#C3BDFF;--retry:#5B4EC2;--sep:rgba(255,255,255,.09);--shadow:0 1px 0 rgba(255,255,255,.04),0 14px 36px rgba(0,0,0,.35);--cap:rgba(255,255,255,.06)}
/* 위쪽: 회차 + 오디오(한 몸 캡슐), 아이콘 스위치 */
.lsn-row{display:flex;align-items:stretch;height:52px;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;gap:0}
.lsn-row .lsn-pick{flex:1;min-width:0}
.lsn-pick select{height:100%;border:0;border-radius:0;background:transparent;padding:0 42px 0 18px;font:800 17px "Noto Sans KR",sans-serif}
.lsn-pick .chev{right:16px}
.aud-btn{flex:none;width:60px;height:auto;padding:0;gap:0;border:0;border-left:1px solid var(--line);border-radius:0;background:var(--cap);color:var(--ink)}
.aud-btn svg{width:24px;height:24px}
.lsn-seg{display:flex;gap:0;margin-top:12px;border:0;border-radius:24px;overflow:hidden;background:var(--soft2);height:48px}
.lsn-seg .tab{flex:1;height:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:0;border:0;border-radius:0;background:transparent;color:var(--ctl);font:700 13.5px "Noto Sans KR",sans-serif}
.lsn-seg .tab+.tab{border-left:1px solid var(--sep)}
.lsn-seg .tab[aria-pressed="true"],.lsn-seg .tab[aria-pressed="true"]+.tab{background:var(--gold-bg);color:var(--gold-ink);border-left-color:transparent}
.lsn-seg .tab[aria-pressed="true"]+.tab{background:transparent;color:var(--ctl)}
.lsn-seg .tab[aria-pressed="true"]+.tab{border-left:1px solid var(--sep)}
.lsn-seg .tab svg{width:22px;height:22px}
/* 카드 */
.card{border:0;border-radius:28px;padding:22px 20px 26px;margin-top:4px;box-shadow:var(--shadow)}
.card.k2j,.card.j2k{border:0}
.ch{display:flex;align-items:center;justify-content:space-between}
.ch-l,.ch-r{display:flex;align-items:center}
.ch-l{gap:8px}.ch-r{gap:6px}
.ch-arrow{width:32px;height:32px;flex:none;margin:0;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ch-arrow:disabled{opacity:.35;cursor:default}
.ch-arrow .ic{width:18px;height:18px}
.ch-n{display:flex;align-items:baseline;gap:5px;min-width:52px;justify-content:center}
.ch-n b{font-size:20px;font-weight:800;color:var(--ink)}
.ch-n span{font-size:14px;color:var(--sub)}
.ch-score{padding:3px 9px;border-radius:10px;background:var(--soft);font-size:12.5px;font-weight:700;color:var(--sub)}
.ch-r .star{width:36px;height:36px;margin:0;border-radius:50%}
.ch-r .star svg{width:22px;height:22px}
.card .bar{height:4px;background:var(--rail);border-radius:2px;margin:12px 0 0}
.card .bar i{background:var(--navy);border-radius:2px}
/* 글자 칸 */
.tiles{display:flex;flex-direction:column;align-items:center;margin:26px 0 0}
.trow{display:flex;justify-content:center;align-items:center}
.tile{flex:none;display:flex;align-items:center;justify-content:center;background:var(--tile);color:var(--ink);font-family:"Noto Sans JP","Klee One",sans-serif;font-weight:500;white-space:nowrap;letter-spacing:-1px}
.tile.ok{background:var(--okbg);color:var(--ok)}
.tile.ng{background:var(--ngbg);color:var(--ng)}
.card .status{margin:22px 0 0;min-height:0;font-size:15px}
.card .status2{margin:4px 0 0;text-align:center;font-size:17px;color:var(--sub);opacity:.8;font-family:"Noto Sans JP",sans-serif;letter-spacing:1px}
.card .qz{margin:20px 0 0}
.card .qz .mean{font-size:24px;font-weight:700;margin:6px 0 0}
.card .qz+.tiles{margin-top:18px}
/* 마이크 · 도움 · 채점 */
.micwrap{display:flex;justify-content:center;margin-top:26px}
.mic{width:88px;height:88px;margin:0;padding:0;border:0;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 22px rgba(32,48,111,.30)}
.mic.live{animation:micPulse 1.4s ease-out infinite}
@keyframes micPulse{0%{box-shadow:0 10px 22px rgba(32,48,111,.30),0 0 0 0 rgba(59,77,163,.45)}100%{box-shadow:0 10px 22px rgba(32,48,111,.30),0 0 0 22px rgba(59,77,163,0)}}
.mic-cap{margin-top:12px;text-align:center;font-size:12.5px;color:var(--sub)}
.helpers{display:flex;justify-content:center;gap:24px;margin-top:22px}
.hb{width:52px;height:52px;margin:0;padding:0;border:0;border-radius:50%;background:var(--soft);color:var(--ctl);display:flex;align-items:center;justify-content:center;cursor:pointer}
.hb.hot{background:var(--gold-bg);color:var(--gold-ink)}
.ask-grade{margin-top:18px;text-align:center;font-size:14px;color:var(--sub)}
.grades{display:flex;justify-content:center;gap:44px;margin-top:20px}
.g{display:flex;flex-direction:column;align-items:center;gap:8px}
.g span{font-size:12.5px;font-weight:700}
.gb{width:68px;height:68px;margin:0;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.g.ng .gb{background:var(--ngbg);color:var(--ng)}.g.ng span{color:var(--ng)}
.g.ok .gb{background:var(--okbg);color:var(--ok)}.g.ok span{color:var(--ok)}
.nextc{width:68px;height:68px;margin:0;padding:0;border:0;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 18px rgba(32,48,111,.26)}
.vwrap{margin-top:18px;text-align:center}
.verd{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:15px}
.verd.ok{background:var(--okbg);color:var(--ok)}
.verd.ng{background:var(--ngbg);color:var(--ng)}
.card .heard{margin:8px 0 14px;min-height:0}
/* 정답 블록: 이모지 + 세로 한 줄(가운데 정렬) */
.card .answer{border-top:0;margin-top:14px;padding-top:0;text-align:center}
.answer .pic{font-size:54px;line-height:1}
.arows{margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.arow{position:relative;padding:9px 0 10px;text-align:center}
.arow+.arow{border-top:1px solid var(--line)}
.arow .lb{position:static;transform:none;font-size:12px;color:var(--sub);align-self:center}
.arow .v{font-family:"Noto Sans JP",sans-serif;font-weight:500;color:var(--ink)}
.arow .v.ko{font-family:"Noto Sans KR",sans-serif;font-weight:700}
/* 선택지 */
.card .opts{margin-top:8px}
.opts .opt{display:flex;align-items:center;width:100%;height:56px;margin:10px 0 0;padding:0 14px;border:1.5px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);cursor:pointer;font:700 17px "Noto Sans KR",sans-serif}
.opts .opt .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--sub);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.opts .opt .t{flex:1;text-align:center}
.opts .opt .sp{flex:none;width:26px}
.opts.ja .opt .t{font-family:"Noto Sans JP",sans-serif;font-size:22px;font-weight:500}
.opts .opt:focus-visible,.hb:focus-visible,.gb:focus-visible,.nextc:focus-visible,.mic:focus-visible,.ch-arrow:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ===== 학습 화면 최종: 버튼 체계 · 머리 아이콘 · 정답 행 ===== */
.ch-icon{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;margin:0;padding:0;border:0;border-radius:50%;background:transparent;color:var(--sub);cursor:pointer}
.ch-icon svg{width:22px;height:22px}
.ch-icon:focus-visible,.nb:focus-visible,.sb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rowa{display:flex;justify-content:center;margin-top:24px}
.rowb{display:flex;align-items:center;justify-content:center;gap:20px;margin-top:18px}
.nb{width:56px;height:56px;flex:none;margin:0;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.nb:disabled{opacity:.35;cursor:default}
.nb .ic{width:22px;height:22px}
.sb{width:56px;height:56px;flex:none;margin:0;padding:0;border:0;border-radius:50%;background:var(--soft);color:var(--ctl);display:flex;align-items:center;justify-content:center;cursor:pointer}
.sb.ok{background:var(--okbg);color:var(--ok)}
.sb.ng{background:var(--ngbg);color:var(--ng)}
.sb.hot{background:var(--gold-bg);color:var(--gold-ink)}
.gpair{display:flex;justify-content:center;gap:28px;margin-top:10px}
.mic.rt{background:var(--retry);box-shadow:0 10px 22px rgba(42,33,117,.38)}
.mic-cap{margin-top:10px;text-align:center;font-size:12.5px;color:var(--sub)}
.ask-grade{margin-top:16px;text-align:center;font-size:14px;color:var(--sub)}
.verdrow{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px}
.heardin{font-size:14px;color:var(--sub)}
.heardin b{font-family:"Noto Sans JP",sans-serif;font-size:17px;font-weight:500;color:var(--ink)}
.picrow{display:flex;align-items:center;justify-content:center;height:56px}
.card .answer{margin-top:12px}
.answer .pic{font-size:52px;line-height:1}
.arow{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:baseline;padding:8px 0 9px;text-align:left}
.arow .vc{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:10px;min-width:0}
.arow .v{font-family:"Noto Sans JP",sans-serif;font-weight:500;color:var(--ink)}
.arow .sm{font:500 14px "Noto Sans KR",sans-serif;color:var(--sub)}
.opts .opt{font-weight:500}

/* 정답 줄: 값은 같은 왼쪽 선에서 시작하고, 값 덩어리 전체는 카드 가운데에 놓임(긴 값은 덩어리가 넓어져 왼쪽으로 늘어남) */
.arows{display:grid;grid-template-columns:minmax(22px,1fr) fit-content(calc(100% - 44px)) minmax(22px,1fr);align-items:stretch;margin-top:16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.arows .bt{border-top:1px solid var(--line)}
.arows .al,.arows .ae{display:flex;align-items:center;padding:8px 0 9px;font-size:12px;color:var(--sub)}
.arows .vc{display:flex;flex-wrap:wrap;align-items:baseline;align-content:center;column-gap:10px;min-width:0;padding:8px 0 9px}
.arows .v{font-family:"Noto Sans JP",sans-serif;font-weight:500;color:var(--ink)}
.arows .sm{font:500 14px "Noto Sans KR",sans-serif;color:var(--sub)}

/* 예문 판: 단어 줄 아래에 예문 1개 + 작은 듣기 버튼 */
.expanel{margin-top:14px;display:flex;align-items:center;gap:8px;padding:12px 8px 12px 16px;border-radius:18px;background:var(--tile)}
.exmain{flex:1;min-width:0}
.exja{font:400 20px/1.9 "Noto Sans JP",sans-serif;color:var(--ink)}
.exja rt{font-size:10px;font-weight:500;color:var(--sub)}
.expanel .hl{color:inherit;border-bottom:2px solid var(--gold-ink)}
.exko{margin-top:2px;font:400 13.5px "Noto Sans KR",sans-serif;color:var(--sub)}
.exbtn{flex:none;width:40px;height:40px;margin:0;padding:0;border:0;border-radius:50%;background:var(--card);color:var(--ctl);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 2px rgba(20,33,74,.08)}
.exbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 예문 판이 들어가도 정답 확인·결과가 한 화면에 들어오도록 간격을 조금 줄임 */
.expanel{margin-top:12px;padding:8px 8px 8px 14px}
.exja{font-size:19px;line-height:1.75}
.exko{margin-top:0}
.ask-grade{margin-top:12px}
.gpair{margin-top:8px}
.picrow{height:50px}
.answer .pic{font-size:46px}
.arows{margin-top:12px}
.card .answer{margin-top:10px}
/* 회차 선택 캡슐: 선택 칸의 테두리선이 잘려서 세로선처럼 보이던 것을 없애고, 캡슐 전체 테두리 색으로 포커스 표시 */
.lsn-row:focus-within{border-color:var(--accent)}
.lsn-pick select{outline:none}
.aud-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--accent)}
/* 위쪽 메뉴: 글자 메뉴 */
.lsn-seg .tab{font-size:15px;font-weight:700;letter-spacing:-.01em}

/* 함께 학습·혼자 복습: 레슨과 같은 드롭박스 */
#chips:has(.lsn-row){display:block;margin-top:14px}

/* 진도: 이메일 바로 아래 작은 한 줄 */
.acct-prog{display:none;font-size:11.5px;line-height:1.25;color:var(--m1);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acct.on .acct-prog{display:block}
.acct.on input{padding:7px 0 1px}

/* ===== 단어장 ===== */
.dict{padding-bottom:40px}
.dict-search{display:block;width:100%;box-sizing:border-box;height:46px;padding:0 18px;border:1.5px solid var(--line);border-radius:23px;background:var(--card);color:var(--ink);font:500 15px "Noto Sans KR",sans-serif;outline:none}
.dict-search:focus{border-color:var(--accent)}
.dict-idx{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.dict-idx::-webkit-scrollbar{display:none}
.dict-idx button{flex:none;min-width:38px;height:38px;border:1px solid var(--line);border-radius:19px;background:var(--card);color:var(--ink);font:700 16px "Noto Sans JP",sans-serif;cursor:pointer}
.dict-count{margin:10px 4px 0;font-size:12.5px;color:var(--sub)}
.dict-sec{position:sticky;top:0;z-index:2;margin:12px 0 4px;padding:7px 6px;font:800 14px "Noto Sans KR",sans-serif;color:var(--sub);background:var(--bg);scroll-margin-top:4px}
.dict-item{display:grid;grid-template-columns:minmax(0,1fr) 44px 30px;align-items:center;margin-top:6px;background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(20,33,74,.05)}
.di-main{display:flex;align-items:center;gap:12px;min-width:0;padding:10px 6px 10px 14px;border:0;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.di-e{flex:none;width:34px;font-size:26px;line-height:1;text-align:center}
.di-t{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;min-width:0}
.di-k{font:600 20px "Noto Sans JP",sans-serif}
.di-s{font:500 14px "Noto Sans JP",sans-serif;color:var(--sub)}
.di-m{flex-basis:100%;font:500 13.5px "Noto Sans KR",sans-serif;color:var(--sub)}
.di-spk{width:40px;height:40px;margin:0 3px 0 0;padding:0;border:0;border-radius:50%;background:transparent;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.di-detail{grid-column:1/-1;padding:0 14px 12px 60px}
.di-row{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--sub)}
.di-row b{font:700 15px "Noto Sans KR",sans-serif;color:var(--ink)}
.di-exrow{display:flex;align-items:center;gap:8px;margin-top:8px;padding:8px 6px 8px 12px;border-radius:14px;background:var(--tile)}
.di-ex{flex:1;min-width:0}
.dict-item .exja{font-size:18px}
.dict-item:has(.di-main:focus-visible),.dict-idx button:focus-visible,.di-spk:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 단어장: 행 이동 막대는 위에 고정, 어디서든 「맨 위로」 */
.dict-idx{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0;margin:0}
.dict-sec{top:54px;scroll-margin-top:62px}
.dict-idx button.on{background:var(--gold-bg);color:var(--gold-ink);border-color:transparent}
.dict-totop{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;width:48px;height:48px;margin:0;padding:0;border:0;border-radius:50%;background:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(20,33,74,.28);display:none;align-items:center;justify-content:center;cursor:pointer}
.dict-totop.show{display:flex}
.dict-totop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
/* 가로로만 잘라서(스크롤 상자가 되지 않게) 단어장의 위쪽 고정 막대가 화면 기준으로 붙도록 */
.app{overflow-x:clip;overflow-y:visible}
.dict-sec{margin:10px 0 0;padding:8px 6px 8px}

/* 문장 카드 */
.sentbox{margin:18px 0 4px;text-align:center;font:500 27px/1.55 "Noto Sans JP",sans-serif;color:var(--ink);padding:6px 4px;word-break:keep-all;overflow-wrap:anywhere}
.sentans{margin-top:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sentans .sa{padding:9px 6px;text-align:center}
.sentans .sa+.sa{border-top:1px solid var(--line)}
.sentans .r1{font:500 24px/1.5 "Noto Sans JP",sans-serif;color:var(--ink)}
.sentans .r2{font:400 16px/1.5 "Noto Sans JP",sans-serif;color:var(--sub)}
.sentans .r3{font:500 15px/1.5 "Noto Sans KR",sans-serif;color:var(--sub)}
.sentans .r4{font:500 17px/1.5 "Noto Sans KR",sans-serif;color:var(--ink)}

/* 단어장 위쪽: 검색창 + 오디오 버튼 */
.dict-head{display:flex;gap:8px;align-items:center}
.dict-head .dict-search{flex:1;min-width:0}
.dict-aud{flex:none;width:46px;height:46px;margin:0;padding:0;border:1.5px solid var(--line);border-radius:23px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.dict-aud svg{width:24px;height:24px}
.dict-aud:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* 단어장: 행 이동 막대 + 오디오 버튼을 한 줄로 위에 고정 */
.dict-bar{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:8px;align-items:center;padding:8px 0}
.dict-bar .dict-idx{position:static;flex:1;min-width:0;padding:0;margin:0;background:transparent}
.dict-bar .dict-aud{width:42px;height:42px;border-radius:21px}

/* 단어장 검색창: 레슨·학습 탭과 같은 캡슐(왼쪽 검색, 오른쪽 오디오) + 최근 검색 */
.dict-row .lsn-pick{display:flex;align-items:center;flex:1;min-width:0;position:relative}
.dict-row .dsi{flex:none;width:20px;height:20px;margin-left:18px;color:var(--sub);display:flex}
.dict-in{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--ink);padding:0 8px 0 10px;font:500 16px "Noto Sans KR",sans-serif;outline:none;-webkit-appearance:none;appearance:none}
.dict-in::-webkit-search-cancel-button,.dict-in::-webkit-search-decoration{display:none}
.dict-in::placeholder{color:var(--sub);font-weight:400;font-size:15px}
.dict-clear{flex:none;width:30px;height:30px;margin:0 8px 0 0;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--sub);font:700 18px/1 sans-serif;cursor:pointer}
.dict-clear[hidden]{display:none}
.dict-recent{margin:0}
.dr-head{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 6px;font-size:12.5px;color:var(--sub)}
.dr-head button{border:0;background:transparent;color:var(--sub);font:600 12.5px "Noto Sans KR",sans-serif;cursor:pointer;padding:4px}
.dr-chips{display:flex;flex-wrap:wrap;gap:6px}
.dr-chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--card);border-radius:18px}
.dr-q{border:0;background:transparent;padding:7px 4px 7px 14px;font:500 14.5px "Noto Sans JP","Noto Sans KR",sans-serif;color:var(--ink);cursor:pointer}
.dr-x{border:0;background:transparent;padding:7px 12px 7px 4px;color:var(--sub);font:700 15px/1 sans-serif;cursor:pointer}

/* 단어장: あ~わ 10개를 화면 폭에 딱 맞게(옆으로 밀지 않아도 전부 보임), 검색 안내 글씨가 잘리지 않게 */
.dict-idx{overflow:visible;gap:4px}
.dict-idx button{flex:1 1 0;min-width:0;padding:0;height:38px;font-size:16px}
.dict-in::placeholder{text-overflow:ellipsis;font-size:14.5px}

/* 검색 중: 키보드가 올라와도 결과가 가려지지 않게 — 검색창을 위에 붙이고, 행 막대·구역 제목은 숨겨 결과를 바로 아래에 */
.dict.searching .dict-bar,.dict.searching .dict-sec{display:none}
.dict.searching .dict-row{position:sticky;top:8px;z-index:7;box-shadow:0 4px 14px rgba(20,33,74,.10)}
.dict.searching .dict-count{margin:8px 4px 2px}
.dict.searching .dict-list{min-height:70vh}
.dict-row:focus-within ~ .dict-list{min-height:70vh}

/* 최근 검색: 2줄까지만 보임 */
.dr-chip{height:34px;box-sizing:border-box}
.dr-chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;max-height:none;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;padding-bottom:2px}
.dr-chips::-webkit-scrollbar{display:none}
.dr-chip{flex:none}

/* 로그인 줄: 아이콘 · 글자 두 줄 · 재입력 버튼을 세로 가운데로, 위아래 여백 같게 */
.acct.on{padding:12px 16px;align-items:center}
.acct.on .acct-main{justify-content:center;align-self:center}
.acct.on input{padding:0;margin:0;height:auto;line-height:1.3}
.acct.on .acct-score{padding:0;margin:2px 0 0;line-height:1.3}
.acct.on .acct-ic,.acct.on .acct-go{align-self:center}

/* 단어장 목록: 한 줄 카드 (★ 즐겨찾기 · › 단어 페이지) */
.di-star{width:44px;height:44px;margin:0;padding:0;border:0;background:transparent;color:#B5BCCB;display:flex;align-items:center;justify-content:center;cursor:pointer}
.di-star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.di-star.on{color:#F0B429}.di-star.on svg{fill:currentColor}
.di-go{display:flex;color:var(--sub);margin-right:8px}.di-go svg{width:18px;height:18px}
.dict-chips{display:flex;gap:6px;margin:10px 0 0}
.dc{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:18px;font:500 14px "Noto Sans KR",sans-serif;cursor:pointer}
.dc.on{border-color:transparent;background:var(--gold-bg);color:var(--gold-ink);font-weight:700}
/* 단어 페이지 */
.wp-top{display:flex;align-items:center;justify-content:space-between}
.wp-back{display:inline-flex;align-items:center;gap:4px;height:44px;padding:0 14px 0 8px;border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--ink);font:700 15px "Noto Sans KR",sans-serif;cursor:pointer}
.wp-back svg{width:22px;height:22px;color:var(--navy)}
.wp-pos{font-size:14px;color:var(--sub)}.wp-pos b{font-size:17px;color:var(--ink)}
.wp-card{margin-top:12px;padding:14px 18px 18px;border-radius:28px;background:var(--card);box-shadow:0 1px 2px rgba(20,33,74,.05),0 14px 36px rgba(20,33,74,.07)}
.wp-pic{text-align:center;font-size:56px;line-height:1.1;margin-bottom:6px}
.wp-card .answer{margin-top:10px}
.wp-card .expanel{margin-top:14px}
.wp-res{margin-top:14px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--soft)}
.wp-res b{display:block;font:800 16px "Noto Sans KR",sans-serif}.wp-res small{display:block;margin-top:1px;font-size:13px;color:var(--sub)}
.wp-ri{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ctl);color:#fff}.wp-ri svg{width:20px;height:20px}
.wp-res.ok{background:var(--okbg)}.wp-res.ok b{color:var(--ok)}.wp-res.ok .wp-ri{background:var(--ok)}
.wp-res.ng{background:var(--ngbg)}.wp-res.ng b{color:var(--ng)}.wp-res.ng .wp-ri{background:var(--ng)}
.wp-acts{margin-top:18px;display:flex;justify-content:center;align-items:center;gap:28px}
.wp-acts .sb{background:var(--card);border:1px solid var(--line);color:var(--navy)}
.wp-acts .wp-star{color:#B5BCCB}.wp-acts .wp-star svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.wp-acts .wp-star.on{color:#F0B429}.wp-acts .wp-star.on svg{fill:currentColor}
.wp-nav{margin-top:16px;display:flex;justify-content:space-between}
.wp-n{display:inline-flex;align-items:center;gap:4px;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:21px;background:var(--card);color:var(--ink);font:600 14px "Noto Sans JP",sans-serif;cursor:pointer}
.wp-n svg{width:18px;height:18px;color:var(--sub)}

/* 메일 탭 */
.ml-head{padding:16px 18px 16px;border-radius:24px;background:var(--card);box-shadow:0 1px 2px rgba(20,33,74,.05),0 14px 36px rgba(20,33,74,.07)}
.ml-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ml-tag{padding:4px 10px;border-radius:12px;background:var(--gold-bg);color:var(--gold-ink);font:700 12.5px "Noto Sans KR",sans-serif}
.ml-date{font-size:13.5px;color:var(--sub)}
.ml-streak{margin-left:auto;font:700 13px "Noto Sans KR",sans-serif;color:#B7791F}
.ml-sub{margin:10px 0 2px;font:700 18px/1.45 "Noto Sans JP",sans-serif;color:var(--ink)}
.ml-subko{font:400 13.5px/1.4 "Noto Sans KR",sans-serif;color:var(--sub)}
.ml-meta{margin-top:8px;font-size:13px;color:var(--sub)}
.ml-prog{margin-top:12px;display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--sub)}.ml-prog b{color:var(--ink)}
.ml-bar{flex:1;height:6px;border-radius:3px;background:var(--line)}.ml-bar i{display:block;height:6px;border-radius:3px;background:#5A4FCF}
.ml-fin{margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--okbg);color:var(--ok);font:700 13.5px "Noto Sans KR",sans-serif}
.ml-u{margin-top:10px;padding:14px 14px 12px 18px;border-radius:20px;background:var(--card);box-shadow:0 1px 2px rgba(20,33,74,.05);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.ml-u.done{box-shadow:inset 3px 0 0 var(--ok),0 1px 2px rgba(20,33,74,.05)}
.ml-jp{font:500 21px/2 "Noto Sans JP",sans-serif;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere}
.ml-ctl{display:flex;gap:6px;align-items:center}
.ml-b{width:42px;height:42px;margin:0;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ml-b svg{width:22px;height:22px}
.ml-b.go{background:var(--navy);border-color:var(--navy);color:#fff}
.ml-b.live{animation:micPulse 1.4s ease-out infinite}
.ml-b.ck{color:#B5BCCB}.ml-b.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ml-ko{grid-column:1/-1;font:400 13.5px/1.45 "Noto Sans KR",sans-serif;color:var(--sub)}
.ml-res{grid-column:1/-1;margin-top:4px;padding:8px 12px;border-radius:12px;font-size:13px;color:var(--sub);background:var(--soft)}
.ml-res b{font-weight:800}.ml-res.ok{background:var(--okbg)}.ml-res.ok b{color:var(--ok)}.ml-res.ng{background:var(--ngbg)}.ml-res.ng b{color:var(--ng)}
.ml-h{margin:22px 4px 6px;font:800 14px "Noto Sans KR",sans-serif;color:var(--sub)}
.ml-past{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:6px;padding:12px 14px;border:0;border-radius:16px;background:var(--card);color:var(--ink);text-align:left;cursor:pointer}
.ml-past .d{font:700 13.5px "Noto Sans KR",sans-serif}.ml-past .t{font:400 13px "Noto Sans JP",sans-serif;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml-past .c{font:700 12.5px "Noto Sans KR",sans-serif;color:var(--sub)}.ml-past .c.ok{color:var(--ok)}

/* 메일 문장 카드: 일본어는 한 줄 전체 폭으로, 아래 줄에 뜻(왼쪽)과 버튼(오른쪽) */
.ml-jp{grid-column:1/-1;grid-row:1}
.ml-ko{grid-column:1;grid-row:2;align-self:center}
.ml-ctl{grid-column:2;grid-row:2}
.ml-res{grid-row:3}

/* 메일 문장: 줄바꿈이 어색하게 끊기지 않게(단어 묶음 안에서도 자연스럽게 이어짐) */
.ml-jp{font-size:19.5px;line-height:2.05}
.ml-jp .nw{display:inline;white-space:normal}

.ml-jp{word-break:normal;overflow-wrap:break-word;line-break:strict}

/* 단어 페이지: 앞·뒤 버튼을 맨 아래 한 줄(‹ 🔊 🎤 ★ ›)로 */
.wp-acts{gap:8px}
.wp-acts .wp-arrow{width:44px;height:44px;color:var(--ink)}
.wp-acts .wp-arrow svg{width:22px;height:22px}
.wp-acts .wp-arrow:disabled{opacity:.3;cursor:default}

/* 메일 탭 (1문장 1페이지 · 선 스타일) */
.mp{padding-bottom:8px}
.mp-row{margin:0}
.mp-info{margin:12px 2px 0;display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--sub)}
.mp-ko{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-streak{flex:none;font-weight:700;color:#B7791F}
.mp-prog{margin:12px 2px 0;display:flex;align-items:center;gap:12px}
.mp-seg{flex:1;display:flex;gap:4px}
.mp-seg .s{flex:1;height:14px;margin:0;padding:0;border:0;background:transparent;position:relative;cursor:pointer}
.mp-seg .s::after{content:"";position:absolute;left:0;right:0;top:5px;height:3px;background:var(--line)}
.mp-seg .s.ok::after{background:var(--ok)}
.mp-seg .s.cur::after{background:#5A4FCF}
.mp-cnt{font-size:13.5px;color:var(--sub)}.mp-cnt b{font-size:15px;color:var(--ink)}
.mp-body{min-height:380px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:12px 0 0}
.mp-s{font:500 27px/2.25 "Noto Sans JP",sans-serif;color:var(--ink);word-break:normal;overflow-wrap:break-word;line-break:strict}
.mp-s rt{font-size:11px;letter-spacing:.5px;color:var(--sub)}
.mp-k{margin-top:4px;font:400 15px/1.5 "Noto Sans KR",sans-serif;color:var(--sub)}
.mp-ctl{margin-top:26px;display:flex;align-items:center;justify-content:center;gap:34px}
.mp-b{width:56px;height:56px;margin:0;padding:0;border:2px solid var(--navy);border-radius:50%;background:transparent;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mp-b svg{width:26px;height:26px}
.mp-b.ck{border-color:#C5CBD8;color:#B5BCCB}.mp-b.ck.on{border-color:var(--ok);color:var(--ok)}
.mp-mic{width:84px;height:84px;margin:0;padding:0;border:2px solid var(--navy);border-radius:50%;background:transparent;color:var(--navy);display:flex;align-items:center;justify-content:center;cursor:pointer}
.mp-mic svg{width:36px;height:36px}
.mp-mic.live{animation:micPulse 1.4s ease-out infinite;background:var(--navy);color:#fff}
.mp-resbox{min-height:56px;margin-top:16px}
.mp-res{font-size:13.5px;color:var(--sub)}
.mp-res b{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;color:var(--ok)}
.mp-res b svg{width:16px;height:16px}
.mp-res.no b{color:var(--sub)}
.mp-res small{display:block;margin-top:4px;font-size:13px}.mp-res small span{color:var(--ink)}
.mp-nav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:4px}
.mp-n{display:inline-flex;align-items:center;gap:2px;height:52px;margin:0;padding:0 4px;border:0;background:transparent;color:var(--ink);font:600 15.5px "Noto Sans KR",sans-serif;cursor:pointer}
.mp-n.nx{color:var(--navy);font-weight:700}
.mp-n svg{width:24px;height:24px}
.mp-n:disabled{color:#C5CBD8;cursor:default}
.mp-fin h3{margin:16px 0 0;font:800 21px "Noto Sans KR",sans-serif}
.mp-fin p{margin:4px 0 0;font-size:14px;color:var(--sub)}
.mp-fi{align-self:center;width:72px;height:72px;border:2px solid #C5CBD8;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#B5BCCB}.mp-fi svg{width:38px;height:38px}
.mp-fi.ok{border-color:var(--ok);color:var(--ok)}
.mp-link{align-self:center;margin:16px 0 0;padding:0 0 2px;border:0;border-bottom:1px solid var(--navy);background:transparent;color:var(--navy);font:700 14px "Noto Sans KR",sans-serif;cursor:pointer}

/* 메일: 앞·뒤 화살표를 가운데 세 버튼과 한 줄에 (‹ 🔊 🎤 ✓ ›) */
.mp-ctl{gap:8px}
.mp-a{width:44px;height:44px;margin:0;padding:0;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.mp-a svg{width:26px;height:26px}
.mp-a:disabled{color:#C5CBD8;cursor:default}
.mp-end{margin-top:40px;justify-content:space-between;width:100%}
.mp-end span{flex:1}

/* 오디오 플레이어: 한글 발음 */
.ap-pron{margin-top:6px;min-height:1px;font:500 19px/1.4 "Noto Sans KR",sans-serif;color:#B9C2E6;letter-spacing:.5px;text-align:center}

/* 메일: 문장 아래 「중요한 단어」 */
.mp-words{margin-top:6px;border-top:1px solid var(--line)}
.mp-wh{margin:16px 2px 4px;font:800 13px "Noto Sans KR",sans-serif;color:var(--sub)}
.mp-w{width:100%;display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr) auto;gap:14px;align-items:center;margin:0;padding:6px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.mp-w .j{font:500 19px/2.1 "Noto Sans JP",sans-serif;white-space:nowrap}
.mp-w .j rt{font-size:10px;color:var(--sub)}
.mp-w .t{display:flex;flex-direction:column;gap:1px;min-width:0;text-align:right}
.mp-w .t b{font:600 14px/1.4 "Noto Sans KR",sans-serif;color:var(--ink)}
.mp-w .t small{font:400 12.5px/1.4 "Noto Sans KR",sans-serif;color:var(--sub)}
.mp-w .sp{display:flex;color:var(--navy);padding-left:2px}.mp-w .sp svg{width:20px;height:20px}

.mp-body{min-height:300px}

/* 메일 오디오: 버튼 순서 = 📖 쭉 1번 · 💬 문장 끊어서 · あ 단어만 */
#audPlayer.mail .ap-sw #apLsAll{order:1}
#audPlayer.mail .ap-sw #apLsSent{order:2}
#audPlayer.mail .ap-sw #apLsWord{order:3}

/* 플레이어: 문장은 원문 그대로(한자·가타카나 위에 작은 히라가나), 한글은 작고 가늘게 */
.ap-rb{display:none;font-family:"Noto Sans JP",sans-serif;font-weight:500;color:#fff;line-height:2.1;overflow-wrap:break-word;word-break:normal;line-break:strict;max-width:100%}
.ap-rb .nw{display:inline;white-space:normal}
.ap-rb rt{font-size:.34em;font-weight:400;letter-spacing:.5px;color:#AEB8DA}
.ap-a.rbmode .ap-rb{display:block}
.ap-a.rbmode .ap-hira,.ap-a.rbmode .ap-kanji{display:none}
.ap-pron{margin-top:10px;font:400 14.5px/1.45 "Noto Sans KR",sans-serif;color:#AEB8DA;letter-spacing:.2px}
.ap-a .ap-mean{margin-top:6px;font-size:16px;font-weight:500;line-height:1.5}
</style>

function kanaCands(str){
  const isK=c=>/[ぁ-ゖー]/.test(c);
  let beam=[{s:'',c:0}];
  for(const ch of String(str)){
    let opts;
    if(isK(ch))opts=[ch];else if(KREAD[ch])opts=KREAD[ch];else return null;
    const nx=[];
    for(const b of beam)opts.forEach((r,i)=>nx.push({s:b.s+r,c:b.c+i}));
    nx.sort((a,b)=>a.c-b.c);beam=nx.slice(0,64);
  }
  return beam.map(b=>b.s);
}

    // 한 라운드 = 그 수업 단어(글자 포함) × 2문제. 한 단어마다 [읽기·말하기·뜻 말하기] 중 하나 + [뜻 고르기·발음 고르기·일본어 고르기] 중 하나를 골라
    // 유형이 골고루 섞이게 하고, 같은 단어가 붙어 나오거나 같은 유형이 3번 연속 나오지 않게 함
    const use={},key=(k,t)=>k+':'+t.join(':');
    const pick=(kind,list)=>{
      const m=Math.min(...list.map(t=>use[key(kind,t)]||0));
      const c=list.filter(t=>(use[key(kind,t)]||0)===m),t=c[Math.floor(Math.random()*c.length)];
      use[key(kind,t)]=(use[key(kind,t)]||0)+1;return t;
    };
    const all=[];
    pool.forEach(w=>{
      const kind=w.kana?'K':'W';
      const a=pick(kind+'s',w.kana?[['read']]:[['read'],['k2j'],['j2k','speak']]);
      const b=pick(kind+'c',w.kana?[['pron'],['k2jc']]:[['j2k','choice'],['pron'],['k2jc']]);
      all.push(Object.assign({},w,{qmode:a[0],qpref:a[1]||null}),Object.assign({},w,{qmode:b[0],qpref:b[1]||null}));
    });
    const sig=x=>x.qmode+(x.qpref||'');
    const okOrder=q=>q.every((x,i)=>(i<1||x.k!==q[i-1].k)&&(i<2||!(sig(x)===sig(q[i-1])&&sig(x)===sig(q[i-2]))));
    let best=shuffle(all);
    for(let t=0;t<400&&!okOrder(best);t++)best=shuffle(all);
    queue=best;
  }else{
    queue=[];
  }
  idx=0;results=[];phase=queue.length?'ask':'empty';msg='';heard='';verdict=null;
  genQuiz();
  persistSession();render();
}
function fixLevelForMode(){
  const lsnOk=l=>(isLessonLevel(l)||isQuizLevel(l))&&!isGroupLevel(l);
  const grpOk=l=>(isLessonLevel(l)||isQuizLevel(l))&&isGroupLevel(l);
  if(P.mode==='lesson'){
    if(!lsnOk(level)){const ll=P.lessonLevel;level=lsnOk(ll)?ll:'L'+LESSONS[LESSONS.length-1].n;}
  }else if(P.mode==='seq'){
    if(!grpOk(level)){const gl=P.groupLevel;level=grpOk(gl)?gl:'L100';}
  }
}
function restore(){
  const s=P.session;
  if(!s||!s.q||s.idx>=s.q.length)return false;
  const lsnSess=isLessonLevel(s.level)||isQuizLevel(s.level);
  if(!lsnSess||P.mode==='dict')return false;
  if(isGroupLevel(s.level)!==(P.mode==='seq'))return false;
  const map=new Map(W.map(w=>[w.k,w]));
  let q=s.q.map(k=>map.get(k)).filter(Boolean);
  if(q.length!==s.q.length)return false;
  if(isQuizLevel(s.level))q=q.map((w,i)=>Object.assign({},w,{qmode:(s.modes&&s.modes[i])||'k2j'}));
  if(Array.isArray(s.sn)&&s.sn.length===q.length&&s.sn.some(x=>x))q=q.map((w,i)=>Object.assign({},w,{seqNo:s.sn[i],seqTotal:s.stt}));
  level=s.level;P.cat='전체';queue=q;idx=s.idx;
  if(isQuizLevel(level)&&Array.isArray(s.modes)&&s.modes.length===q.length&&Array.isArray(s.opts)&&s.opts.length===q.length&&Array.isArray(s.subs)&&s.subs.length===q.length){qmodes=s.modes;qopts=s.opts;qsub=s.subs;}else genQuiz();
  results=(s.res||[]).map(v=>v===null?undefined:v);
  phase='ask';resumed=idx>0;return true;
}
function stopRec(){endListen=null;clearTimeout(timer);if(rec){rec.onend=rec.onerror=rec.onresult=null;try{rec.abort();}catch(e){}rec=null;}}

function speak(t){
  if(!('speechSynthesis' in window))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().replace('_','-').startsWith('ja'));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

const speakW=w=>speak(w.kana?`${w.k}。${w.x}`:(w.sp||w.k));
let endListen=null;
let noSound={i:-1,c:0};
const NO_SOUND_MSG=()=>noSound.c>=2?'이 단어는 음성 인식이 잘 안 될 수 있어요. 「정답 보기」로 직접 확인해도 돼요.':'소리가 안 들렸어요. 마이크가 켜진 뒤에 또박또박 읽어보세요.';
const bumpNoSound=()=>{noSound=noSound.i===idx?{i:idx,c:noSound.c+1}:{i:idx,c:1};};
const silenceFor=w=>w.n<=3?2000:w.n===4?2500:3000;
function listen(){
  if(!SR){phase='nomic';msg='이 브라우저는 음성 인식을 지원하지 않아요. 직접 판정으로 진행하세요.';render();return;}
  stopRec();heard='';
  const KO=isKo();
  let done=false,segs=[],silence=null,restarts=0,me=null;
  const SILENCE_MS=KO?2000:silenceFor(queue[idx]),MAX_MS=25000,T0=Date.now();
  const end=()=>{
    if(done||rec!==me){clearTimeout(silence);return;}done=true;
    clearTimeout(timer);clearTimeout(silence);endListen=null;
    try{rec&&rec.stop();}catch(e){}
    const text=segs.map(r=>r[0]).join('');
    if(!norm(text)){bumpNoSound();phase='ask';msg=NO_SOUND_MSG();render();return;}
    const prefix=segs.slice(0,-1).map(r=>r[0]).join('');
    const alts=segs[segs.length-1].map(a=>prefix+a);
    const every=segs.flatMap(r=>r).filter(Boolean);   /* 덩어리마다·후보마다 따로도 판정: 세 번 읽다가 한 번만 맞게 들려도 정답 */
    const all=[...new Set([...alts,...every])];
    if(KO)finishKo(all);else finish(all);
  };
  endListen=end;
  /* 엔진이 아무 소리도 못 잡고 먼저 끝나버리면(짧은 단어에서 흔함) 최대 3번까지 조용히 다시 듣는다 */
  const canRetry=()=>!done&&!segs.length&&restarts<3&&Date.now()-T0<MAX_MS-4000;
  const retry=old=>{
    restarts++;
    try{old.onend=old.onerror=old.onresult=old.onaudiostart=null;old.abort();}catch(e){}
    setTimeout(()=>{if(done||rec!==old)return;try{begin();}catch(e){end();}},220);
  };
  const begin=()=>{
    const r=new SR();rec=r;me=r;
    r.lang=KO?'ko-KR':'ja-JP';r.interimResults=true;r.maxAlternatives=10;r.continuous=true;
    /* 크롬 신버전: 정답 단어를 힌트로 알려주면 짧은 소리도 더 잘 잡힘(지원하지 않으면 무시) */
    try{if(!KO&&window.SpeechRecognitionPhrase){const w=queue[idx];r.phrases=[w.k,...(w.alts||[]).slice(0,3)].filter(Boolean).map(t=>new SpeechRecognitionPhrase(t,5.0));}}catch(e){}
    r.onresult=e=>{
      segs=[];
      for(let i=0;i<e.results.length;i++){segs.push([...e.results[i]].map(a=>a.transcript));}
      const sh=segs.map(x=>x[0]).join('');
      const el=document.getElementById('status');if(el){const kt=KO?sh:toKanaText(sh).replace(/[\u4e00-\u9fff々]+/g,'…');el.textContent='듣는 중… '+kt;}
      clearTimeout(silence);silence=setTimeout(end,SILENCE_MS);
    };
    r.onerror=e=>{
      if(done||rec!==r)return;
      if(e.error==='no-speech'&&segs.length){end();return;}
      if(e.error==='no-speech'&&canRetry()){retry(r);return;}
      done=true;clearTimeout(timer);clearTimeout(silence);endListen=null;
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){phase='nomic';msg='마이크 권한이 없어요. 아래 직접 판정을 사용하세요.';}
      else if(e.error==='no-speech'){bumpNoSound();phase='ask';msg=NO_SOUND_MSG();}
      else if(e.error==='aborted'){return;}
      else{phase='ask';msg='인식 오류('+e.error+'). 다시 시도하세요.';}
      render();
    };
    r.onaudiostart=()=>{if(done||rec!==r)return;const el=document.getElementById('status');if(el&&!segs.length)el.textContent=KO?'지금 한국어로 뜻을 말해주세요':`지금 말해주세요 · ${SILENCE_MS/1000}초간 조용하면 자동으로 판정해요`;};
    r.onend=()=>{if(done||rec!==r)return;if(canRetry()){retry(r);return;}end();};
    r.start();
  };
  try{
    begin();phase='listening';msg='';render();
    timer=setTimeout(end,MAX_MS);
  }catch(e){phase='nomic';msg='마이크를 시작할 수 없어요. 직접 판정을 사용하세요.';render();}
}

function record(w,ok){

      const qt=P.qstats[key]||{ok:0,ng:0};

function showHeard(alts){for(const a of alts){const t=toKanaText(a);if(t&&!hasKanji(t))return t;}

}
function isChoiceNow(){const Q=isQuizLevel(level);if(!Q)return false;const qm=qmodes[idx],J=qm==='j2k',JS=J&&qsub[idx]==='speak';return (J&&!JS)||qm==='pron'||qm==='k2jc';}

/* 글자 칸: 기본 같은 크기 / 작은 글자(ゃ·っ)가 붙은 칸만 가로로 늘어남 / 한 줄에 안 들어가면 같은 비율로 줄이고, 더 길면 5칸씩 두 줄 */
let CARDW=318;
const TILE={base:92,fs:52,gap:10};
function tilesHtml(us,lab,cls,scale){
  scale=scale||1;
  const nat=u=>{const n=[...u].length-1;return n<=0?TILE.base:Math.round(24+TILE.fs+0.68*TILE.fs*n);};
  const tot=(a,sc)=>a.reduce((t,u)=>t+Math.round(nat(u)*sc),0)+TILE.gap*sc*(a.length-1);
  let rows;
  if(tot(us,scale)<=CARDW||us.length<=3)rows=[us];
  else{rows=[];for(let i=0;i<us.length;i+=5)rows.push(us.slice(i,i+5));}
  const sc=rows.reduce((m,r)=>Math.min(m,tot(r,scale)<=CARDW?scale:CARDW/tot(r,1)),scale);
  const html=rows.map((r,ri)=>{
    const cells=r.map(u=>{
      const w=Math.round(nat(u)*sc),h=Math.round(TILE.base*sc),fs=TILE.fs*sc,t=lab(u),ch=[...t];
      const inner=ch.length>1?`<span style="font-size:${fs.toFixed(1)}px">${ch[0]}</span><span style="font-size:${(fs*.68).toFixed(1)}px">${ch.slice(1).join('')}</span>`:`<span style="font-size:${fs.toFixed(1)}px">${t}</span>`;
      return `<div class="tile ${cls||''}" style="width:${w}px;height:${h}px;border-radius:${Math.round(22*sc)}px">${inner}</div>`;
    }).join('');
    return `<div class="trow" style="gap:${Math.round(TILE.gap*sc)}px;margin-top:${ri?Math.round(10*sc):0}px">${cells}</div>`;
  }).join('');
  return `<div class="tiles">${html}</div>`;
}

const HG_ROWS={a:'あかがさざただなはばぱまやらわぁゃ',i:'いきぎしじちぢにひびぴみりぃ',u:'うくぐすずつづぬふぶぷむゆるぅゅゔ',e:'えけげせぜてでねへべぺめれぇ',o:'おこごそぞとどのほぼぽもよろをぉょ'};
const HG_V={};Object.keys(HG_ROWS).forEach(v=>[...HG_ROWS[v]].forEach(c=>HG_V[c]=v));

function hgJong(syl,j){const c=syl.charCodeAt(0)-0xAC00;return(c>=0&&c<11172&&c%28===0)?String.fromCharCode(0xAC00+c+j):syl;}
function hgJong2(syl,j){const m=/ー$/.test(syl);const r=hgJong(m?syl.slice(0,-1):syl,j);return m?r+'ー':r;}
function toHangul(k,mark){
  if(HG_SPECIAL[k])return HG_SPECIAL[k];
  const ch=[...k],out=[];let lastV='';
  for(let i=0;i<ch.length;i++){
    const c=ch[i],n=ch[i+1]||'';
    if(c==='ー')continue;
    if(c==='っ'){if(out.length)out[out.length-1]=hgJong2(out[out.length-1],19);lastV='';continue;}
    if(c==='ん'){if(out.length)out[out.length-1]=hgJong2(out[out.length-1],4);lastV='';continue;}
    if(out.length&&((c==='う'&&(lastV==='o'||lastV==='u'))||(c==='お'&&lastV==='o')||(c==='あ'&&lastV==='a')||(c==='い'&&(lastV==='e'||lastV==='i'))||(c==='え'&&lastV==='e'))){if(mark&&out.length&&!/ー$/.test(out[out.length-1]))out[out.length-1]+='ー';continue;}
    let syl,v;
    if(HG_COMBO[c+n]){syl=HG_COMBO[c+n];v=HG_V[n];i++;}
    else if(HG_BASE[c]){syl=HG_BASE[c];v=HG_V[c];}
    else{out.push(c);lastV='';continue;}
    if(Array.isArray(syl))syl=out.length===0?syl[0]:syl[1];
    out.push(syl);lastV=v;
  }
  return out.join('');
}

function answerSent(w){

function answer(w){
  if(w.c==='문장')return answerSent(w);
  const kanji=showKanji(w);
  const hg=w.kana?w.m:toHangul(w.k,true);
  const rows=[];
  if(kanji)rows.push(['한자',kanji,w.m]);
  rows.push(['히라가나',w.k,w.kana?hg:(kanji?hg:`${hg} · ${w.m}`)]);
  rows.push(['카타카나',toKata(w.k),'']);
  const fs=v=>{const n=[...v].length;return Math.max(15,Math.min(n>=8?21:27,Math.floor((CARDW-44)/n)));};
  const ex=w.kana?`<p class="status" style="margin:10px 0 0">예) <span class="jp-ex">${w.x}</span> (${w.xm})</p>`:'';
  return `<div class="answer"><div class="picrow"><span class="pic" aria-hidden="true">${w.e||''}</span></div><div class="arows">${rows.map(([l,v,sm],i)=>`<span class="al${i?' bt':''}" aria-hidden="true"></span><div class="vc${i?' bt':''}"><span class="v" style="font-size:${fs(v)}px">${v}</span>${sm?`<span class="sm">${sm}</span>`:''}</div><span class="ae${i?' bt':''}"></span>`).join('')}</div>${ex}</div>`;
}

function toggleStar(k){
