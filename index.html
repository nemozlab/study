/* ===== 메일 탭: 매일 중요한 메일 1통 — 1문장 1페이지로 넘기며 듣고 따라 읽기 (NEMOZ.IO 로그인 전용) ===== */
const MAIL_DONE_KEY='tomoz-mail-done';
let mailData=null,mailState='idle',mailIdx=0,mailPage=0,mailLive=-1,mailRes={},mailRec=null,mailTimer=0;
const mlYmd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mlLabel=ds=>{const d=new Date(ds+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+'일월화수목금토'[d.getDay()]+')';};
const mlDone=()=>{try{return JSON.parse(localStorage.getItem(MAIL_DONE_KEY))||{};}catch(e){return {};}};
function mlMark(date,i,on){const a=mlDone();let l=a[date]||[];l=l.filter(x=>x!==i);if(on)l.push(i);a[date]=l;try{localStorage.setItem(MAIL_DONE_KEY,JSON.stringify(a));}catch(e){}}
const mlCount=m=>(mlDone()[m.date]||[]).filter(i=>i<m.units.length).length;
const mlFull=m=>mlCount(m)>=m.units.length;
const mlFirstUnread=m=>{const d=mlDone()[m.date]||[];for(let i=0;i<m.units.length;i++)if(!d.includes(i))return i;return m.units.length;};
function mlStreak(){   /* 오늘(또는 어제)부터 거꾸로, 그날 메일을 끝까지 읽은 날이 며칠 이어졌는지 */
  if(!mailData)return 0;const by={};mailData.forEach(m=>by[m.date]=m);
  let n=0,d=new Date();
  for(let i=0;i<400;i++){const ds=mlYmd(d),m=by[ds];if(m&&mlFull(m))n++;else if(i!==0)break;d.setDate(d.getDate()-1);}
  return n;
}
async function mailLoad(){
  if(mailState==='loading')return;mailState='loading';
  try{const r=await fetch('mails.json',{cache:'no-store'});if(!r.ok)throw new Error(r.status);const d=await r.json();
    mailData=((d&&d.mails)||[]).filter(m=>m&&m.date&&Array.isArray(m.units)&&m.units.length).sort((a,b)=>a.date<b.date?1:-1);mailState='ok';mailIdx=0;mailPage=mailData.length?mlFirstUnread(mailData[0]):0;}
  catch(e){mailState='err';}
  if(P.mode==='mail'&&mailAllowed())render();
}
function mlAudBuild(mail){
  const mm=AUD.opts.mm||'sent',out=[];
  const sent=(u,i)=>({uid:'u'+i,u:i,nx:true,once:mm==='cont',k:u.k,sp:u.sp||u.jp,sd:u.k,m:u.m,e:'✉️',c:'문장',alts:[u.jp],n:units(u.k).length,au:true,pr:u.pr||toHangul(u.k,true),rb:u.rb||u.jp});
  mail.units.forEach((u,i)=>{
    if(mm!=='word')out.push(sent(u,i));
    if(mm==='word')(u.words||[]).forEach((w,j)=>{const plain=audPlain(w.rb||w.k).replace(/[〜~]/g,'');out.push({uid:'u'+i+'w'+j,u:i,nx:true,k:w.k,sp:w.sp||plain,sd:w.k,m:w.m,e:'📝',alts:[plain],n:units(w.k).length,au:true,pr:w.pr||toHangul(w.k,true),rb:w.rb||w.k});});
  });
  return out.length?out:mail.units.map(sent);   /* 단어가 하나도 없는 메일이면 문장으로 */
}
function stopMlRec(){clearTimeout(mailTimer);if(mailRec){mailRec.onresult=mailRec.onerror=mailRec.onend=null;try{mailRec.abort();}catch(e){}mailRec=null;}}
function mlEnd(i,msg){stopMlRec();mailLive=-1;mailRes[i]={msg};render();}
function mlGrade(alts,u){   /* 소리가 조금 달라도 괜찮게: 맞음 / 거의 맞음(읽은 걸로 처리) / 다시 */
  const acc=accepted({k:u.k,alts:[u.jp,u.sp].filter(Boolean)}),cand=[];
  for(const a of alts){const t=toKanaText(a);cand.push(a,t);if(hasKanji(t)){const k=kanaCands(t);if(k)cand.push(...k.slice(0,24));}}
  if(cand.some(a=>looseHit(a,acc)))return 'ok';
  const y=sk(u.k);if(!y)return 'no';
  let best=1;for(const a of cand){const n=sk(a);if(!n)continue;best=Math.min(best,lev(n,y)/Math.max(n.length,y.length));}
  return best<=0.4?'close':'no';
}
function mlFinish(i,alts){
  stopMlRec();const mail=mailData&&mailData[mailIdx],u=mail&&mail.units[i];if(!u)return;
  const g=mlGrade(alts,u);
  mailLive=-1;mailRes[i]={g,heard:g==='ok'?u.jp:showHeard(alts)};if(g!=='no')mlMark(mail.date,i,true);render();
}
function mlRead(i){
  const mail=mailData&&mailData[mailIdx],u=mail&&mail.units[i];if(!u)return;
  if(mailLive===i){stopMlRec();mailLive=-1;render();return;}
  const SRC=window.__SR||SR;
  if(!SRC){mailRes[i]={msg:'이 브라우저는 음성 인식을 지원하지 않아요'};render();return;}
  try{speechSynthesis.cancel();}catch(e){}
  stopMlRec();mailLive=i;mailRes[i]=null;render();
  const r=new SRC();mailRec=r;r.lang='ja-JP';r.interimResults=false;r.maxAlternatives=5;r.continuous=false;
  let got=false;
  r.onresult=e=>{got=true;const alts=[];for(const rs of e.results)for(const a of rs)alts.push(a.transcript);mlFinish(i,alts);};
  r.onerror=e=>{if(!got)mlEnd(i,e&&e.error==='not-allowed'?'마이크를 쓸 수 있게 허용해 주세요':'소리가 안 들렸어요');};
  r.onend=()=>{if(!got&&mailRec)mlEnd(i,'소리가 안 들렸어요');};
  mailTimer=setTimeout(()=>{if(!got)mlEnd(i,'소리가 안 들렸어요');},15000);
  try{r.start();}catch(e){mlEnd(i,'마이크를 켤 수 없어요');}
}
function mlGoto(pg,scroll){
  stopMlRec();mailLive=-1;const mail=mailData&&mailData[mailIdx];if(!mail)return;
  mailPage=Math.max(0,Math.min(mail.units.length,pg));render();
  if(scroll){const r=document.querySelector('.mp-row');if(r)window.scrollTo({top:Math.max(0,window.scrollY+r.getBoundingClientRect().top-8)});}
}
function mlAct(a,i){
  const mail=mailData&&mailData[mailIdx];
  if(a==='reload'){mailState='idle';render();return;}
  if(!mail)return;
  if(a==='prev'){mlGoto(mailPage-1,true);return;}
  if(a==='next'){mlGoto(mailPage+1,true);return;}
  if(a==='go'){mlGoto(i,true);return;}
  if(a==='first'){mlGoto(mlFirstUnread(mail),true);return;}
  if(a==='restart'){mlGoto(0,true);return;}
  const u=mail.units[mailPage];if(!u)return;
  if(a==='word'){const w=(u.words||[])[i];if(w)speak(w.sp||audPlain(w.rb||w.k).replace(/[〜~]/g,''));return;}
  if(a==='speak')speak(u.sp||u.jp);
  else if(a==='read')mlRead(mailPage);
  else if(a==='check'){mlMark(mail.date,mailPage,!(mlDone()[mail.date]||[]).includes(mailPage));render();}
}
function renderMail(m){
  if(mailState==='idle'){mailLoad();}
  if(mailState==='idle'||mailState==='loading'){m.innerHTML='<div class="mp"><p class="status">메일을 불러오는 중이에요…</p></div>';return;}
  if(mailState==='err'||!mailData||!mailData.length){m.innerHTML='<div class="mp"><p class="status">아직 메일이 없어요.<br>mails.json 파일을 올리면 여기에 나와요.</p><button class="mp-link" data-ml="reload" type="button">다시 불러오기</button></div>';return;}
  const mail=mailData[mailIdx]||mailData[0],n=mail.units.length,done=(mlDone()[mail.date]||[]).filter(i=>i<n);
  const pg=Math.max(0,Math.min(n,mailPage)),streak=mlStreak();
  const opts=mailData.map((x,j)=>`<option value="${j}"${j===mailIdx?' selected':''}>${mlLabel(x.date)}${mlFull(x)?' ✓':''}</option>`).join('');
  const seg=mail.units.map((u,i)=>`<button type="button" class="s${done.includes(i)?' ok':''}${i===pg?' cur':''}" data-ml="go" data-i="${i}" aria-label="${i+1}번째 문장"></button>`).join('');
  let body='',words='';
  if(pg<n){
    const u=mail.units[pg],ok=done.includes(pg),r=mailRes[pg],live=mailLive===pg;
    const ws=Array.isArray(u.words)?u.words:[];
    if(ws.length)words=`<div class="mp-words"><div class="mp-wh">중요한 단어</div>${ws.map((w,j)=>`<button class="mp-w" data-ml="word" data-i="${j}" type="button"><span class="j" lang="ja">${audRuby(w.rb||w.k,[],false)}</span><span class="t"><b>${w.m||''}</b><small>${w.pr||toHangul(w.k,true)}</small></span><span class="sp" aria-hidden="true">${ui('volume',20)}</span></button>`).join('')}</div>`;
    let res='';
    if(live)res='<div class="mp-res"><b>듣고 있어요</b> · 또박또박 읽어보세요</div>';
    else if(r&&r.msg)res=`<div class="mp-res"><b>${r.msg}</b></div>`;
    else if(r)res=`<div class="mp-res ${r.g==='no'?'no':'ok'}"><b>${r.g==='ok'?ic('check')+'잘 읽었어요':r.g==='close'?ic('check')+'거의 맞아요 · 읽은 걸로 할게요':'다시 한 번 읽어볼까요?'}</b><small>들린 소리 · <span lang="ja">${r.heard||'—'}</span></small></div>`;
    body=`<div class="mp-body"><div class="mp-s" lang="ja">${audRuby(u.rb||u.jp,[],false)}</div><div class="mp-k">${u.m||''}</div>
    <div class="mp-ctl"><button class="mp-a" data-ml="prev" type="button" aria-label="이전 문장"${pg<=0?' disabled':''}>${ic('prev')}</button><button class="mp-b" data-ml="speak" type="button" aria-label="듣기">${ui('volume',26)}</button><button class="mp-mic${live?' live':''}" data-ml="read" type="button" aria-label="따라 읽기 (마이크)">${ui('mic',36)}</button><button class="mp-b ck${ok?' on':''}" data-ml="check" type="button" aria-pressed="${ok}" aria-label="읽음 표시">${ic('check')}</button><button class="mp-a" data-ml="next" type="button" aria-label="다음 문장">${ic('next')}</button></div>
    <div class="mp-resbox">${res}</div></div>`;
  }else{
    const left=n-done.length;
    body=`<div class="mp-body mp-fin"><div class="mp-fi${left?'':' ok'}">${ic('check')}</div><h3>${left?'마지막 문장까지 왔어요':'이 메일을 끝까지 읽었어요'}</h3><p>${left?`아직 읽지 않은 문장이 ${left}개 있어요`:(streak?`연속 ${streak}일째예요`:'')}</p>${left?'<button class="mp-link" data-ml="first" type="button">읽지 않은 문장으로 가기</button>':''}<button class="mp-link" data-ml="restart" type="button">처음부터 다시 읽기</button><div class="mp-ctl mp-end"><button class="mp-a" data-ml="prev" type="button" aria-label="이전 문장">${ic('prev')}</button><span></span><button class="mp-a" type="button" aria-label="다음 문장" disabled>${ic('next')}</button></div></div>`;
  }
  m.innerHTML=`<div class="mp"><div class="lsn-row mp-row"><label class="lsn-pick"><select id="mailSel" aria-label="메일 선택">${opts}</select><span class="chev">${ic('down')}</span></label><button class="aud-btn" data-aud="open" aria-label="오디오로 듣기">${AUD_ICON.head}</button></div>
  <div class="mp-info"><span class="mp-ko">${mail.subjectKo||''}</span>${streak?`<b class="mp-streak">연속 ${streak}일</b>`:''}</div>
  <div class="mp-prog"><div class="mp-seg">${seg}</div><span class="mp-cnt"><b>${Math.min(pg+1,n)}</b> / ${n}</span></div>
  ${body}${words}</div>`;
}

/* 예문 표기: 漢字{よみ} → 한자 위에 히라가나(후리가나) */
function audParse(mk){
  const out=[],re=/((?:[\u4e00-\u9fff々]+)|(?:[A-Za-z0-9][A-Za-z0-9 ]*))\{([^}]+)\}/y;let i=0;
  while(i<mk.length){re.lastIndex=i;const m=re.exec(mk);if(m){out.push({t:m[1],r:m[2]});i+=m[0].length;}else{out.push({t:mk[i]});i++;}}
  return out;
}
const audPlain=mk=>audParse(mk).map(u=>u.t).join('');
function audKata(a){   /* 가타카나 덩어리 위에 히라가나 읽기를 자동으로 붙임 */
  const o=[];for(const x of a){if(!x.r&&/^[ァ-ヶー]$/.test(x.t)){const l=o[o.length-1];if(l&&l.kata){l.t+=x.t;continue;}o.push({t:x.t,kata:true});}else o.push(x);}
  o.forEach(x=>{if(x.kata)x.r=toHira(x.t);});return o;
}
function audRuby(mk,hl,mark){
  const u=audKata(audParse(mk)),plain=u.map(x=>x.t).join('');let s=-1,e=-1;
  for(const c of (hl||[])){const k=plain.indexOf(c);if(k>=0){s=k;e=k+c.length;break;}}
  const hlOn=mark!==false;
  let pos=0;
  const parts=u.map(x=>{const a=pos,b=pos+x.t.length;pos=b;const inner=x.r?`<ruby>${x.t}<rt>${x.r}</rt></ruby>`:x.t;return {a,h:(hlOn&&s>=0&&a<e&&b>s)?`<span class="hl">${inner}</span>`:inner};});
  /* 줄을 바꿀 수 있는 자리: 단어 경계(브라우저의 일본어 단어 분리) — 없으면 글자 사이. 목표 단어 안쪽은 항상 붙임 */
  const cuts=new Set();
  try{for(const g of new Intl.Segmenter('ja',{granularity:'word'}).segment(plain))cuts.add(g.index);}catch(err){}
  const canBreak=a=>a>0&&(cuts.size?cuts.has(a):true)&&!(s>=0&&a>s&&a<e);
  const groups=[];
  parts.forEach(p=>{if(!groups.length||canBreak(p.a))groups.push([]);groups[groups.length-1].push(p.h);});
  return groups.map(g=>`<span class="nw">${g.join('')}</span>`).join('');
}

function dictSave(q){   /* 최근 검색에 담기: 같은 말은 맨 앞으로, 쓰다 만 앞부분(ね → ねこ)은 정리, 10개까지 */
  q=String(q||'').trim();if(!q)return;

  dictWheel();
}
function dictSaveFor(w){   /* 결과 단어에 도달했을 때: 한글로 찾았으면 그 단어의 뜻, 일본어로 찾았으면 그 단어를 최근 검색에 담음 */
  const q=dictQ.trim();if(!q||!w)return;
  let rep=q;
  if(/[가-힣ㄱ-ㅎ]/.test(q))rep=String(w.m||'').split(/\s*[·,/]\s*|\s*\(/)[0].trim()||q;

}

    await cloudRef.set({stats:P.stats,qstats:P.qstats||{},session:P.session||null,level:P.level,ts:P.ts||Date.now(),custom:P.custom||[],mode:P.mode||'lesson',seq:P.seq||{},stars:P.stars||{}});
    syncOn();
  }catch(e){
    cloudRef=null;
    setSync('계정 저장에 실패해서 이 기기·브라우저에만 저장돼요'+(e&&e.code?' ('+e.code+')':''));
  }
  cloudBusy=false;
  if(cloudPending&&cloudRef){cloudPending=false;scheduleCloud();}
}
function mergeCloud(c){
  if(!c)return;
  const cs=c.stats||{};
  for(const k of Object.keys(cs)){const a=P.stats[k],b=cs[k];if(!a||((b&&b.t)||0)>(a.t||0))P.stats[k]=b;}
  mergeQ(c.qstats);mergeStars(c.stars);
  if((c.ts||0)>(P.ts||0)){if(c.mode)P.mode=normMode(c.mode);if(c.seq)P.seq=c.seq;}
  mergeCustom(c.custom);
  const fresh=phase==='ask'&&idx===0&&results.every(r=>r===undefined);
  if(fresh&&c.session&&c.session.q&&c.session.idx<c.session.q.length&&(c.ts||0)>(P.ts||0)){
    P.session=c.session;P.level=c.level||P.level;P.ts=c.ts;
    restore();
  }
  savePrgLocal();
  applyCustom();
  render();
}

/* ---- 내 단어 ---- */
const toHira=t=>(t||'').normalize('NFKC').replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(/\s+/g,'');
function applyCustom(){
  for(let i=W.length-1;i>=0;i--){if(W[i].custom)W.splice(i,1);}
  const have=new Set(W.map(w=>w.k));
  const ckj=[];
  for(const c of (P.custom||[])){
    if(!c||!c.k||have.has(c.k))continue;
    have.add(c.k);
    const alts=c.kj?[c.kj]:[];
    W.push({k:c.k,alts,m:c.m||'',e:c.e||'📝',c:'내 단어',n:units(c.k).length,custom:true});
    if(c.kj&&hasKanji(c.kj))ckj.push([norm(c.kj),c.k]);
  }
  KJ=[...KJ_BASE,...ckj].sort((a,b)=>b[0].length-a[0].length);
  renderMine();
}
function mergeQ(qs){
  if(!qs)return;P.qstats=P.qstats||{};
  for(const k of Object.keys(qs)){const a=P.qstats[k],b=qs[k];if(!a||((b&&b.t)||0)>(a.t||0))P.qstats[k]=b;}
}
function mergeCustom(list){
  if(!Array.isArray(list))return;
  P.custom=P.custom||[];
  for(const c of list){if(c&&c.k&&!P.custom.some(x=>x.k===c.k))P.custom.push(c);}
}
function setMineMsg(t){const el=document.getElementById('mineMsg');if(el)el.textContent=t;}
function renderMine(){
  const ul=document.getElementById('mineList');if(!ul)return;
  const list=P.custom||[];
  ul.innerHTML=list.map(c=>`<li><span><span class="k">${c.k}</span> <span class="m">${c.kj||''} ${c.m||''}</span></span><button class="delbtn" data-act="delmine" data-k="${c.k}" aria-label="${c.k} 삭제">✕</button></li>`).join('');
}
function addCustom(){
  const ta=document.getElementById('mineText');const text=(ta&&ta.value)||'';
  P.custom=P.custom||[];
  const added=[],dup=[],bad=[];
  text.split('\n').forEach(line=>{
    line=line.trim();if(!line)return;
    let parts;
    if(/[,，\t]|\s-\s/.test(line))parts=line.split(/[,，\t]|\s+-\s+/).map(x=>x.trim());
    else{const m=line.match(/^(\S+)\s+(.+)$/);parts=m?[m[1],m[2]]:[line];}
    const k=toHira(parts[0]);
    if(!/^[ぁ-ゖー]+$/.test(k)||k.length>20){bad.push(parts[0]);return;}
    if(W.some(w=>w.k===k)){dup.push(k);return;}
    const kj=parts.slice(1).find(x=>x&&hasKanji(x)&&!/[가-힣]/.test(x))||'';
    const m=(parts[1]&&parts[1]!==kj)?parts[1]:(parts[2]&&parts[2]!==kj?parts[2]:'');
    const em=parts.slice(1).find(x=>x&&/\p{Extended_Pictographic}/u.test(x))||'';
    const c={k,m:em&&m===em?'':m,kj,e:em||'📝'};
    P.custom.push(c);W.push({k,alts:kj?[kj]:[],m:c.m,e:c.e,c:'내 단어',n:units(k).length,custom:true});
    added.push(k);
  });
  if(P.custom.length>400){P.custom.length=400;}
  applyCustom();
  if(added.length){if(ta)ta.value='';savePrg();}
  const by={};added.forEach(k=>{const n=units(k).length;const key=n>=6?'6음+':n+'음';by[key]=(by[key]||0)+1;});
  let msg=added.length?`${added.length}개 추가했어요 (${Object.entries(by).map(([a,b])=>a+' '+b+'개').join(', ')})`:'추가된 단어가 없어요';
  if(dup.length)msg+=`\n이미 있는 단어라 건너뜀: ${dup.join(', ')}`;
  if(bad.length)msg+=`\n히라가나(카타카나)가 아니라 건너뜀: ${bad.join(', ')}`;
  if(added.length&&!cloudEmail)msg+='\n이메일을 입력해야 새로고침해도 단어가 남아요';
  setMineMsg(msg);
  render();
}
function delCustom(k){
  P.custom=(P.custom||[]).filter(c=>c.k!==k);
  applyCustom();savePrg();
  if(queue.some(w=>w.k===k))start(level);else render();
}
let cloudDb=null,cloudUid=null;
function pickRef(){
  if(!cloudDb)return null;
  return cloudEmail?cloudDb.doc('progress/'+cloudEmail):null;
}
const HINT='이메일을 입력하면 그 이메일 기준으로 기록이 저장돼요';
function syncOn(){setSync(cloudEmail?`☁️ ${cloudEmail} 기준으로 자동 저장 중`:HINT);}
let acctEditing=false;
const ACCT_ICON={mail:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="m4 7.5 8 6 8-6"/></svg>',ok:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/></svg>'};
function renderAcct(){
  const box=document.getElementById('acct'),inp=document.getElementById('email'),btn=document.getElementById('acctBtn'),ic=document.getElementById('acctIc');
  if(!box||!inp||!btn||!ic)return;
  const locked=!!cloudEmail&&!acctEditing;
  box.classList.toggle('on',locked);
  inp.readOnly=locked;
  if(locked)inp.value=cloudEmail;
  btn.textContent=locked?'재입력':'입력';
  btn.dataset.act=locked?'email-edit':'email';
  ic.innerHTML=locked?ACCT_ICON.ok:ACCT_ICON.mail;
}
let lastApplyAt=0;
async function applyEmail(){
  lastApplyAt=Date.now();
  const inp0=document.getElementById('email');
  // 재입력 중에 빈 칸으로 '입력' → 취소 (현재 이메일 유지)
  if(inp0&&!inp0.value.trim()&&cloudEmail){acctEditing=false;renderAcct();syncOn();return;}
  await applyEmailCore();
  const inp=document.getElementById('email');
  if(cloudEmail&&inp&&emailKey(inp.value)===cloudEmail)acctEditing=false;
  renderAcct();
}
async function applyEmailCore(){
  const inp=document.getElementById('email');const raw=((inp&&inp.value)||'').trim();
  let em='';
  if(raw){em=emailKey(raw);if(!em){setSync('이메일 형식을 확인해주세요');return;}}
  if(em===cloudEmail){if(inp)inp.value=em;return;}
  stopRec();
  savePrgLocal();
  if(cloudRef){clearTimeout(cloudTimer);try{await pushCloud();}catch(e){}}
  cloudEmail=em;
  emStore(em);
  if(inp)inp.value=em;
  P=loadLocal();
  cloudRef=pickRef();
  let existed=false;
  if(cloudRef){
    try{
      const snap=await cloudRef.get();
      if(snap.exists){
        existed=true;const c=snap.data()||{},cs=c.stats||{};
        for(const k of Object.keys(cs)){const x=P.stats[k],y=cs[k];if(!x||((y&&y.t)||0)>(x.t||0))P.stats[k]=y;}
        mergeQ(c.qstats);mergeStars(c.stars);
        if((c.ts||0)>(P.ts||0)){if(c.mode)P.mode=normMode(c.mode);if(c.seq)P.seq=c.seq;}
        mergeCustom(c.custom);
        if(c.session&&c.session.q&&c.session.idx<c.session.q.length&&(c.ts||0)>(P.ts||0)){P.session=c.session;P.level=c.level||P.level;P.ts=c.ts;}
      }
    }catch(e){cloudRef=null;setSync('이메일 기록을 불러오지 못했어요'+(e&&e.code?' ('+e.code+')':''));}
  }
  savePrgLocal();
  applyCustom();
  level=P.level||'2';fixLevelForMode();
  if(!restore())start(level);else render();
  if(cloudRef){setSync(existed?`☁️ ${em} 기록을 불러왔어요`:`☁️ ${em} 새 기록으로 시작해요`);scheduleCloud();}
  else if(!cloudDb)setSync(em?`${em} 기준으로 이 기기·브라우저에 저장돼요`:HINT);
  else if(!em)setSync(HINT);
}
async function initCloud(){
  try{
    const inp=document.getElementById('email');
    if(inp)inp.value=cloudEmail||'';
    if(!window.claude||!window.claude.use){setSync(cloudEmail?'이 기기·브라우저에만 저장돼요 (claude.ai 링크로 열면 이메일 기준으로 어디서든 이어져요)':HINT);return;}
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    cloudDb=db;cloudUid=(db&&user)?await user.id():null;
    cloudRef=pickRef();
    if(!cloudRef){setSync(cloudEmail?'로그인 정보를 확인할 수 없어 이 기기·브라우저에만 저장돼요':HINT);return;}
    const snap=await cloudRef.get();
    if(snap.exists)mergeCloud(snap.data());
    syncOn();scheduleCloud();
  }catch(e){setSync('진행 기록은 이 기기·브라우저에만 저장돼요');}
}
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='jn'&&e.key==='Enter'&&e.target.value)jumpTo(+e.target.value);
  if(e.target&&e.target.id==='email'&&e.key==='Enter')applyEmail();});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='email'&&e.target.value.trim())applyEmail();});
document.addEventListener('input',e=>{
  if(e.target&&e.target.id==='email'){
    const v=emailKey(e.target.value);
    if(v&&v!==cloudEmail)setSync('Enter 또는 \'입력\'을 누르면 이 이메일의 새 기록이 시작돼요');
  }
});
if('speechSynthesis' in window){speechSynthesis.getVoices();}
applyCustom();
fixLevelForMode();
if(!restore())start(level);else render();
renderAcct();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
initCloud();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}});}
(function(){var sp=document.getElementById('splash');if(!sp||!document.documentElement.classList.contains('splash-on'))return;var done=false;
function hide(){if(done)return;done=true;sp.classList.add('out');setTimeout(function(){document.documentElement.classList.remove('splash-on');},500);}
sp.addEventListener('pointerdown',hide);setTimeout(hide,2300);
/* 시스템이 먼저 보여주는 아이콘(남색 바탕 위 둥근 사각형 안의 얼굴) → 같은 자리·같은 크기·같은 모양에서 시작 화면 전체로 펼쳐짐.
   실제 폰 화면 녹화로 잰 값: 아이콘 캔버스 308px, 보이는 모양 폭 266px(슈퍼타원), 중심은 앱 영역 중심에서 아래로 약 3px.
   어긋나면 DX·DY(px)·IC(아이콘 크기)·SQ(모양 폭)만 조정. */
try{if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
var img=sp.querySelector('.sp-img');if(!img||!img.animate)return;
var DX=0,DY=3,IC=308,SQ=266,N=4;
var W=innerWidth,H=innerHeight,IW=853,IH=1844,sc=Math.max(W/IW,H/IH),ox=(W-IW*sc)/2,oy=(H-IH*sc)/2;
var SX=484,SY=866,SR=264,TXB=568;                    /* 그림 속에서 아이콘 중심에 해당하는 점 / 아이콘이 담는 반지름 / 위쪽 글씨(Learn. Connect.) 아래 끝 */
var Ox=ox+SX*sc,Oy=oy+SY*sc;
var kk=IC/749*(250/SR);                               /* 시작 화면 그림 1px이 아이콘 안에서 차지하는 css px */
var s0=kk/sc,tx=W/2+DX-Ox,ty=H/2+DY-Oy;
function sq(a,at){var pts=[],M=96,e=2/N;for(var i=0;i<M;i++){var t=i/M*2*Math.PI,c=Math.cos(t),d=Math.sin(t),b=d<0?at:a;
  var x=Ox+a*(c<0?-1:1)*Math.pow(Math.abs(c),e),y=Oy+b*(d<0?-1:1)*Math.pow(Math.abs(d),e);pts.push(x.toFixed(1)+'px '+y.toFixed(1)+'px');}
  return 'polygon('+pts.join(',')+')';}
var a0=(SQ/2)/s0,a1=Math.hypot(W,H)*1.6,t0=Math.min(a0,(SY-TXB)*sc);   /* 시작할 때 위쪽만 살짝 낮춰 글씨가 안 비치게 */
img.style.transformOrigin=Ox+'px '+Oy+'px';
/* 시스템 시작 화면이 사라지는 동안(약 0.5초)은 출발 모양(시스템 화면과 같은 그림)을 그대로 보여주고, 그 뒤에 펼침 시작 */
img.animate([{offset:0,transform:'translate('+tx+'px,'+ty+'px) scale('+s0+')',clipPath:sq(a0,t0)},
             {offset:1,transform:'translate(0px,0px) scale(1)',clipPath:sq(a1,a1)}],
            {duration:800,delay:500,easing:'cubic-bezier(.5,0,.25,1)',fill:'both'});
}catch(e){}
})();
</script>
